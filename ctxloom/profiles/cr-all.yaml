version: "1.0.0"
description: "Comprehensive single-agent code review across every lens, language-agnostic. For parallel synthesized review, `ctxloom weave` the individual cr-<lens> members + cr-synthesis."
tags:
  - review
  - comprehensive
# One agent, all lenses. Cheaper/interactive alternative to a weave ensemble.
bundles:
  - ctxloom-default/code-review-base#fragments/conduct
  - ctxloom-default/code-review-structural#fragments/general
  - ctxloom-default/code-review-correctness#fragments/general
  - ctxloom-default/code-review-maintainability#fragments/general
  - ctxloom-default/code-review-reliability#fragments/general
  - ctxloom-default/code-review-performance#fragments/general
  - ctxloom-default/code-review-language-idioms#fragments/general
  - ctxloom-default/code-review-testing#fragments/general
  - ctxloom-default/code-review-security#fragments/general
  - ctxloom-default/code-review-api-compat#fragments/general
  - ctxloom-default/code-review-dx#fragments/general
  - ctxloom-default/code-review-ux#fragments/general
  - ctxloom-default/code-review-accessibility-i18n#fragments/general
  - ctxloom-default/code-review-cost-infra#fragments/general
  - ctxloom-default/code-review-data#fragments/general
  - ctxloom-default/code-review-observability#fragments/general
  - ctxloom-default/code-review-dependencies#fragments/general
  - ctxloom-default/code-review-documentation#fragments/general
