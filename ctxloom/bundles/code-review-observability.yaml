            - backend
        content: |-
            # Lens: Observability

            Can we tell what happened in production?

            ## Check
            - **Logging**: structured, correct levels, actionable; no secrets/PII;
              correlation/request IDs.
            - **Metrics**: key operations measured; bounded label cardinality.
            - **Tracing**: spans for significant operations; trace context propagated
              across boundaries.
            - **Security/audit logging**: auth events, access-control denials, and
              privileged actions recorded (OWASP A09:2025 — Security Logging & Alerting
              Failures; logging without alerting is the failure mode).
