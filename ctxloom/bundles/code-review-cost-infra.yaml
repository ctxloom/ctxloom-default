fragments:
    general:
        tags:
            - review
            - cost
            - infra
            - finops
        content: |-
            # Lens: Cost & Infrastructure (IaC / FinOps)

            Does this change spend money wisely?

            ## Check
            - IaC diffs that change spend: instance sizes/types, replica counts, storage
              class, provisioned throughput, cross-AZ/region egress, always-on vs
              autoscaled, missing TTL/lifecycle.
            - Right-sizing and autoscaling over fixed over-provisioning.
            - Required cost-allocation tags/labels (owner, env, cost-center); budget/
              quota guardrails.
            - Code-side cost: unbounded scans, oversized payloads, chatty cross-region
              calls, missing caching/pagination.

            Flag cost-relevant changes; exact dollar impact needs a cost tool (note it).
