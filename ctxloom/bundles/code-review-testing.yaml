    golang:
        tags:
            - review
            - testing
            - go
        content: |-
            # Lens: Testing — Go

            ## Check
            - **Table-driven tests** with `t.Run` subtests; `t.Parallel()` (safe by default
              in 1.22+).
            - **Interfaces for seams**, not mocks of concrete types; `httptest` for HTTP.
            - `t.Cleanup` for teardown; golden files for large outputs; `testing.B.Loop`
              (1.24) for benchmarks.
            - Run with **`-race`** in CI; avoid `time.Sleep` — use `testing/synctest` (GA 1.25)
              or channels to synchronize.
        content_hash: sha256:0a4d729e8f832696e084f652f3a48a859ee3246f281d2aadb59608cfc1caf471
        distilled: |-
