version: 1.0.0
tags:
    - review
    - testing
author: ctxloom
description: Testing-quality review lens. Language-agnostic `general` fragment plus each language's test framework idioms and determinism tooling. Compose `code-review-testing#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    cpp:
        tags:
            - review
            - testing
            - cpp
        content: |-
            # Lens: Testing — C++

            ## Check
            - **GoogleTest/Catch2**; fixtures (`TEST_F`), parameterized (`TEST_P`).
            - **gMock** against interfaces; avoid heavy macro-driven logic in tests.
            - Run under **sanitizers** (ASan/UBSan/TSan/MSan); add **coverage-guided fuzzing**
              (libFuzzer/AFL++) in CI for untrusted-input paths.
            - Deterministic; no shared global state between tests; avoid sleep-based sync.
        content_hash: sha256:58342b57c72fc18a54df1df5ac72c1e53085284714c1be4df0092bc2b2f86270
        distilled: |-
            # Testing — C++

            - **GoogleTest/Catch2**: `TEST_F`, `TEST_P` (fixtures, parameterized)
            - **gMock** for interfaces; NO heavy macro logic in tests
            - Sanitizers (ASan/UBSan/TSan/MSan); coverage fuzzing (libFuzzer/AFL++) in CI for untrusted inputs
            - Deterministic: NO shared global state; NO sleep-based sync
        distilled_by: claude-haiku-4-5-20251001
    csharp:
        tags:
            - review
            - testing
            - csharp
        content: |-
            # Lens: Testing — C#

            ## Check
            - **xUnit/NUnit** with `[Theory]`/`[InlineData]`; FluentAssertions.
            - **Moq/NSubstitute** at boundaries — don't mock concrete types; avoid
              over-mocking.
            - Inject **`TimeProvider`** (.NET 8+; `FakeTimeProvider` for tests) instead of
              `DateTime.Now`; Testcontainers for integration.
            - No shared state across tests; poll/await instead of `Thread.Sleep`.
        content_hash: sha256:9e7965e1a71bd7e5748f6990378a6c2136953e19f8ad0dd43b023f7253b79e39
        distilled: |-
