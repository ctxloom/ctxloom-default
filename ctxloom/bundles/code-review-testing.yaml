    python:
        tags:
            - review
            - testing
            - python
        content: |-
            # Lens: Testing — Python

            ## Check
            - **`pytest`** fixtures (scoped) over `setUp`; `parametrize` for cases.
            - **Mock at boundaries** (`unittest.mock`), not internals; `responses`/`respx`
              for network; `freezegun`/`time-machine` for time.
            - `tmp_path` for filesystem; avoid shared mutable fixtures (order coupling).
            - Consider `hypothesis` for property-based coverage.
        content_hash: sha256:75e9bfb64056eaf38456f5b7e0789e4d6e49e0005389daca98a2c80a0b34ea80
