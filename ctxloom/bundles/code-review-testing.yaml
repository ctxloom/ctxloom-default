    swift:
        tags:
            - review
            - testing
            - swift
        content: |-
            # Lens: Testing — Swift

            ## Check
            - **Swift Testing** (`@Test`/`#expect`/`#require`, parameterized `arguments:`) is
              the default for new unit/integration tests; XCTest stays for UI
              (`XCUIApplication`) & performance.
            - Async via `async`/`await` and `confirmation` (not XCTest `expectation`s); exit
              tests for crash/`fatalError` paths.
            - **Inject** clock/network dependencies (protocols) rather than using live
              ones; avoid timing-based flakiness.
            - Mocks via protocol conformances; don't assert on private internals.
        content_hash: sha256:4a0c6aedd0ad0c64371804e26995009d981fc4173ffff1e4bd84f907b189748e
        distilled: |-
            # Lens: Testing — Swift

            ## Check
            - **Swift Testing** (`@Test`, `#expect`, `#require`, `arguments:`) for unit/integration; XCTest for UI & performance.
            - Async: `async`/`await`, `confirmation` (not `expectation`s); exit on crash/`fatalError`.
            - Inject dependencies (clock/network protocols), not live.
            - Mock via protocols; don't assert private internals.
        distilled_by: claude-haiku-4-5-20251001
    typescript:
        tags:
            - review
            - testing
            - typescript
        content: |-
            # Lens: Testing — TypeScript / JS

            ## Check
            - **Test behavior, not implementation** (Testing Library philosophy); Vitest is
              the greenfield default (native ESM/TS), Jest still common in legacy/RN.
            - **Fake timers** for time; **MSW** for network — avoid mocking everything.
            - Handle async correctly (await/return promises); avoid missed assertions.
            - Beware brittle snapshot overuse; isolate state in `beforeEach`; no
              cross-test global leakage.
        content_hash: sha256:5536e87507908ff9c62ce9fa08f39a3c1d81641ea657db832e1ec892ecd54f0c
