    java:
        tags:
            - review
            - testing
            - java
        content: |-
            # Lens: Testing — Java

            ## Check
            - **JUnit 5/6** (6.0 GA Sep 2025, Java 17 baseline) + fluent assertions (AssertJ);
              `@ParameterizedTest` for cases.
            - **Mockito** at boundaries — don't mock value objects; avoid over-mocking.
            - Inject a **`Clock`** (or narrower **`InstantSource`**) instead of
              `LocalDateTime.now()`; **Testcontainers** (2.x) for real integration.
            - Avoid `@TestMethodOrder` dependence; **Awaitility** over `Thread.sleep`.
        content_hash: sha256:8e0307f2756b949c100f97b8151c0074af63d146686ee031d54fb88f7ce4ac74
        distilled: |-
