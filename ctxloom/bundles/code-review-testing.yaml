    rust:
        tags:
            - review
            - testing
            - rust
        content: |-
            # Lens: Testing — Rust

            ## Check
            - `#[test]` units in `#[cfg(test)]` modules; integration tests in `tests/`;
              **doc tests** for public examples.
            - Mock via **traits** (e.g. `mockall`), not concrete types.
            - Avoid `unwrap` that hides the real assertion; use `#[should_panic]`
              intentionally.
            - `proptest`/`quickcheck` for property coverage; keep tests deterministic.
        content_hash: sha256:b586786447f803ba5f0b7f363eccbb70c5209203ad95b762122c55fd07ae3b51
