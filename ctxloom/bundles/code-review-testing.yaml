    kotlin:
        tags:
            - review
            - testing
            - kotlin
        content: |-
            # Lens: Testing — Kotlin

            ## Check
            - JUnit 5 / **Kotest** (6.x); **MockK** (coroutine-aware) at boundaries.
            - **`runTest`** with a `TestDispatcher` for virtual-time coroutine tests — no
              `Thread.sleep`/real delays; launch open-ended collectors in `backgroundScope`
              so the test doesn't hang.
            - **Turbine** for `Flow` assertions; don't mock data classes.
            - Parameterized cases; deterministic, isolated tests.
        content_hash: sha256:841cb79024257b95e457ecce358fb946c6ff9c57f63213e57dd4c703adae3598
