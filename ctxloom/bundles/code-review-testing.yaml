author: ctxloom
description: Testing-quality review lens. Language-agnostic `general` fragment plus each language's test framework idioms and determinism tooling. Compose `code-review-testing#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    general:
        tags:
        - review
        - testing
        content: |-
            # Lens: Testing Quality

            Are there correct, well-designed, trustworthy tests for this change?

            ## Check
            - **Coverage of behavior**: new/changed paths exercised, including error and
              edge paths — not just the happy path.
            - **Meaningful assertions**: tests verify behavior, not just "doesn't throw".
            - **Test smells**: assertion roulette (unlabeled, hard-to-attribute assertions —
              the smell is ambiguity, not count), mystery guest, over-mocking, fixture coupling,
              order-dependent tests.
            - **Determinism**: no reliance on wall-clock, real network, random seeds,
              sleeps, or shared global state. Prefer fakes/clocks/sync over timing.

            Pair with the project's language fragment for framework idioms.
