        content: |-
            # Lens: Accessibility & Internationalization (web/frontend)

            ## Accessibility (WCAG 2.2, POUR)
            - Native HTML over ARIA — "no ARIA beats bad ARIA"; roles/labels only where needed.
            - Keyboard operable; focus visible and not obscured; logical focus order.
            - Sufficient color contrast; never convey meaning by color alone.
            - Images have alt text; form fields have labels.
            - **WCAG 2.2** additions: target size ≥24×24px, drag alternatives, accessible auth
              (no cognitive-test gates), consistent help, avoid redundant entry.

            ## Internationalization
            - No hard-coded user-facing strings (externalized/translatable).
            - Locale-aware dates/numbers/currency/collation.
            - Layout tolerates text expansion (~30–50%) and RTL.
