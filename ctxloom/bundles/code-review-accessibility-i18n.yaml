            # Lens: Accessibility & Internationalization

            ## Accessibility (WCAG 2.2, POUR)
            - Native HTML preferred; ARIA only where needed
            - Keyboard: visible, unobscured focus; logical order
            - Sufficient color contrast; never color-only meaning
            - Images: alt text; form fields: labels
            - WCAG 2.2: ≥24×24px targets, drag alternatives, accessible auth (no cognitive gates), consistent help, no redundant entry

            ## Internationalization
            - Externalize all user-facing strings
            - Locale-aware: dates/numbers/currency/collation
            - Layout: 30–50% text expansion tolerance, RTL support
