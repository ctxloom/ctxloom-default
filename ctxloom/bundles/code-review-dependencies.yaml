fragments:
    general:
        tags:
            - review
            - dependencies
            - supply-chain
            - licensing
        content: |-
            # Lens: Dependencies, Supply Chain & Licensing

            ## Check
            - New/updated deps: necessary? maintained? known CVEs? (a small utility may
              not warrant a dependency.)
            - Versions pinned/locked; provenance trusted; transitive risk considered.
            - **Licensing**: new deps' licenses compatible with this project's; no
              copyleft contamination; attribution where required.
            - **Provenance**: SLSA build level; Sigstore-signed artifacts; SBOM in SPDX or
              CycloneDX. (Vulnerable/outdated components = OWASP A03:2025, Software Supply
              Chain Failures.)
