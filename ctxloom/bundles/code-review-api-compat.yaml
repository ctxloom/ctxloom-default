            - api
            - compatibility
            - library
        content: |-
            # Lens: API Design & Backward Compatibility

            For public/library/service interfaces and wire/schemas.

            ## Check
            - **Design**: clear, minimal, hard to misuse; sensible defaults; consistent
              with existing API conventions; make illegal states unrepresentable.
            - **Breaking changes**: removed/renamed/retyped fields or changed semantics
              flagged; prefer additive change + deprecation before removal.
            - **Versioning**: SemVer correctness (breaking→major, additive→minor); wire
              compatibility (protobuf field-number reuse, JSON shape, enum additions).
            - Migration/deprecation path documented for consumers.
