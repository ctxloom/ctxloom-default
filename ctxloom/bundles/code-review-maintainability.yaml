    swift:
        tags:
            - review
            - maintainability
            - swift
        content: |-
            # Lens: Maintainability — Swift

            ## Check
            - **`guard`** for early exit and unwrapping; keep the happy path
              un-indented.
            - **Extensions** to organize a type by concern (conformances, helpers).
            - Names follow the API Design Guidelines — clarity at the call site.
            - Avoid massive view controllers; extract responsibilities.
            - Computed properties over ad-hoc getter methods where natural.
        content_hash: sha256:aaaff1602eaaea7ca20348385ca1b3893e4c3ae07dfffb3b83144789c26b9982
