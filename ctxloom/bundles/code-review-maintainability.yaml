version: 1.0.0
tags:
    - review
    - maintainability
    - readability
author: ctxloom
description: Maintainability & readability review lens. Language-agnostic `general` fragment plus per-language idiomatic-readability guidance. Compose `code-review-maintainability#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    cpp:
        tags:
            - review
            - maintainability
            - cpp
        content: |-
            # Lens: Maintainability — C++

            ## Check
            - **RAII** removes manual-cleanup clutter; ownership visible in signatures
              (smart pointers / value types).
            - **`const`-correctness** documents intent; `auto` where it aids reading,
              not where it hides the type.
            - **`std::ranges`/`views`** (and STL algorithms) over hand-rolled loops where clearer.
            - Keep template metaprogramming and macros to what genuinely needs them.
            - Meaningful names; small functions; headers expose contract, not internals.
        content_hash: sha256:3882b476d0e864b3ada3cd74ac66727de586a050b40c9716f22c15dd18bef1cd
        distilled: |-
            # Lens: Maintainability — C++

            ## Check
            - **RAII** — ownership in signatures
            - **`const`-correctness**; judicious `auto`
            - **`std::ranges`/`views`, STL algorithms** vs. hand-rolled loops
            - Template metaprogramming, macros: genuine needs only
            - Meaningful names; small functions; contracts in headers
        distilled_by: claude-haiku-4-5-20251001
    csharp:
        tags:
            - review
            - maintainability
            - csharp
        content: |-
            # Lens: Maintainability — C#

            ## Check
            - **Expression-bodied members** and **`var`** where the type is obvious.
            - **`record`/pattern matching/switch expressions** over verbose branching.
            - **Guard clauses** over nested `if`; constants over magic values.
            - Avoid `#region` hiding complexity; XML docs on public API.
            - LINQ where it reads clearly; loops where they're clearer.
        content_hash: sha256:e52c567610c580904fa69066ba7627d7c78e7aeac4706b525f329e53df443627
        distilled: |-
            # Lens: Maintainability — C#

            ## Check
            - Expression-bodied members; `var` when obvious
            - `record`, pattern matching, switch expressions vs. verbose branching
            - Guard clauses, not nested `if`; constants, not magic values
            - Avoid `#region` hiding; XML docs on public API
            - LINQ where readable; loops when clearer
        distilled_by: claude-haiku-4-5-20251001
    general:
        tags:
            - review
            - maintainability
            - readability
        content: |-
            # Lens: Maintainability & Readability

            Can the next engineer understand and safely change this quickly?

            ## Check
            - **Simplicity**: is there a simpler solution to the actual problem? Deep
              nesting, long functions/params, high branching → flag.
            - **Duplication**: copy-paste or near-duplicate logic that should be shared
              (vs. coincidental similarity that should stay separate).
            - **Naming**: intention-revealing, consistent vocabulary, no stale or
              misleading names.
            - **Comments**: explain *why* (rationale, trade-offs), not *what* the code
              already says; no dead/commented-out code.
            - Consistent with surrounding code's prevailing patterns.

            (Formatting/style is a linter's job — don't spend review on it.)
            Pair with the project's language fragment for idiomatic readability.
        content_hash: sha256:5117aacebe7d20e5c5cfbd52303347f807840da863de11c466d7ee24a3b43668
        distilled: |-
            # Lens: Maintainability & Readability

            Can the next engineer understand and safely change this quickly?

            ## Check
            - **Simplicity**: Flag deep nesting, long functions/params, high branching.
            - **Duplication**: Extract shared logic; distinguish coincidental similarity.
            - **Naming**: Intention-revealing, consistent, no stale/misleading names.
            - **Comments**: *Why* (rationale, trade-offs), not *what*. Remove dead code.
            - **Consistency**: Match surrounding patterns.

            Formatting → linter. Pair with language fragment for idiomatic guidance.
        distilled_by: claude-haiku-4-5-20251001
    golang:
        tags:
            - review
            - maintainability
            - go
        content: |-
            # Lens: Maintainability — Go

            ## Check
            - **Guard clauses / early return**: handle errors immediately; avoid nested
              `if err == nil` pyramids.
            - **Naming**: short names in short scopes, descriptive at package level;
              avoid stutter (`user.UserName`).
            - **Don't over-abstract**: no interface until there's a second
              implementation.
            - Return errors with context (`fmt.Errorf("...: %w", err)`) rather than bare
              re-returns.
            - Keep functions small; prefer clear control flow over clever tricks. Let
              `gofmt`/`golangci-lint` own layout.
        content_hash: sha256:33afaf4688665dc358603dea5de1e45d8bfe3c631482736661cdfb1d17f559dd
        distilled: |-
