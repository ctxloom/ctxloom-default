    java:
        tags:
            - review
            - maintainability
            - java
        content: |-
            # Lens: Maintainability — Java

            ## Check
            - **Small methods**, single responsibility; avoid deep inheritance — favor
              composition.
            - **`record`/`Optional`/`enum`** to express intent over boilerplate or
              sentinel values.
            - **Constants** for magic numbers/strings; meaningful names (no Hungarian).
            - Streams where they clarify, plain loops where they're clearer.
            - Javadoc on public API explaining contract and *why*.
        content_hash: sha256:c5172a4728b90437277da26fb863c9c80b2303e86ffe0ff023779109f401c454
        distilled: |-
            # Lens: Maintainability — Java

            ## Check
            - Small methods, single responsibility; prefer composition over deep inheritance
            - `record`/`Optional`/`enum` for intent (not boilerplate/sentinels)
            - Constants for magic numbers/strings; no Hungarian notation
            - Streams if clearer; else plain loops
            - Javadoc: public API contract & rationale
        distilled_by: claude-haiku-4-5-20251001
    kotlin:
        tags:
            - review
            - maintainability
            - kotlin
        content: |-
            # Lens: Maintainability — Kotlin

            ## Check
            - **Scope functions** (`let/run/apply/also`) used sparingly — chained, they
              hurt readability more than they help.
            - **Expression bodies**, `data class`, named/default args over telescoping
              overloads; guard conditions in `when` (`is X if …`) over nested branching.
            - **Extension functions** grouped by feature, not dumped as a global
              grab-bag; explicit backing fields (`field =`) over `_state`/`state` mirrors.
            - Prefer `val`/immutability; clear null-handling (`?.`/`?:`) over `!!`.
        content_hash: sha256:2e9ff8eb485e493ad03d68088970ee410260892d93464289fbfc16a4ce62853a
        distilled: |-
            # Lens: Maintainability — Kotlin

            ## Check
            - **Scope functions** — avoid chains (hurt readability)
            - **Expression bodies**, `data class`, named/default args over overloads; guard conditions in `when` (`is X if …`)
            - **Extension functions** — group by feature, not globally; explicit backing fields (`field =`)
            - **Immutability** — prefer `val`; clear null-handling (`?.`/`?:`) over `!!`
        distilled_by: claude-haiku-4-5-20251001
    python:
        tags:
            - review
            - maintainability
            - python
        content: |-
            # Lens: Maintainability — Python

            ## Check
            - **Comprehensions** where they read clearly; avoid nested/triple
              comprehensions that need decoding.
            - **Type hints** on public functions aid the next reader and tooling.
            - **f-strings** over `%`/`.format`; **dataclasses/enums** over dicts of
              magic keys.
            - Early returns over deep nesting; avoid clever one-liners.
            - Meaningful names (no `l`, `I`, `O`, `data2`); explicit params over
              `**kwargs` pass-through when the contract is known.
        content_hash: sha256:69b8a4c6ad969dcc11fd01e31fa234604e0226b0981c2e67f262e38cc767a7b7
        distilled: |-
            # Lens: Maintainability — Python

            ## Check
            - **Comprehensions**: readable; avoid nested/triple
            - **Type hints** on functions
            - **f-strings** over `%`/`.format`; **dataclasses/enums** over dicts w/ magic keys
            - Early returns over nesting; no clever one-liners
            - Meaningful names (not `l`, `I`, `O`, `data2`); explicit params over `**kwargs`
        distilled_by: claude-haiku-4-5-20251001
    rust:
        tags:
            - review
            - maintainability
            - rust
        content: |-
            # Lens: Maintainability — Rust

            ## Check
            - **`?` to flatten** error handling; `match`/`if let`/`let ... else` over
              nested `if let` pyramids.
            - **Iterator chains** where they read clearly (not unreadable mega-chains).
            - **Newtypes** and descriptive types over bare primitives for intent.
            - Doc comments (`///`) with examples on public items.
            - Keep `unsafe` minimal and comment its invariant; let `clippy` flag the
              rest.
        content_hash: sha256:f22c767599bf4094ac717e271f2d3acb34c26fd189fe1aae8d1b889cad0c5bd7
        distilled: |-
