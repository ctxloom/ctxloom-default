    typescript:
        tags:
            - review
            - maintainability
            - typescript
        content: |-
            # Lens: Maintainability — TypeScript

            ## Check
            - **Avoid `any`** and `as` casts — prefer `satisfies`/type guards; casts erase
              the types the next reader relies on.
            - **Named types** for non-trivial shapes over inline anonymous objects.
            - **Destructuring** and early returns for clarity; avoid nested ternaries.
            - Narrow at boundaries so internals stay strongly typed.
            - JSDoc only where the types don't already express intent.
        content_hash: sha256:d94eb0740948eba3a97b4c0f2a1273372266fe7ea90e9ccedb2b78d806ff7fc2
