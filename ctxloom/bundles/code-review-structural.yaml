        distilled_by: claude-haiku-4-5-20251001
    golang:
        tags:
            - review
            - structural
            - go
        content: |-
            # Lens: Design & Architecture — Go

            ## Check
            - **Accept interfaces, return structs**: functions take the narrow interface
              they need; constructors return concrete types.
            - **Small interfaces** defined at the consumer, not the producer; resist
              large "manager" interfaces. Interface pollution (one-impl interfaces with
              no second caller) is over-abstraction — flag it.
            - **Package boundaries**: no import cycles; `internal/` used to hide
              implementation; packages named for what they provide, not `util`/`common`.
            - **Dependency direction**: domain packages don't import transport/storage;
              wire concretions at `main`/composition root (constructor injection, not
              package-global singletons).
            - **Options over positional args**: 3+ params or optional config → functional
              options or a config struct, not a long positional signature.
            - Prefer composition/embedding over deep type hierarchies; embed for reuse
              only when the promoted method set is genuinely part of the contract.
        content_hash: sha256:1b4264d1ebd5479ed24564480fffbbbf040835dfa06b519fc0c627438cf786ea
        distilled: |-
            # Lens: Design & Architecture — Go

            ## Check
            - **Accept interfaces, return structs**: Take narrow interface; return concrete struct.
            - **Small interfaces**: Consumer-defined only. No large "manager" interfaces. Flag single-impl interfaces (over-abstraction).
            - **Package boundaries**: No import cycles. Use `internal/` to hide implementation. Name for purpose, not `util`/`common`.
            - **Dependency direction**: Domain ≠ transport/storage imports. Wire concretions at `main`/composition root. Constructor injection, not package-global singletons.
            - **Options over positional args**: 3+ params → functional options or config struct (not positional).
            - **Composition/embedding**: Prefer over hierarchies. Embed only when promoted methods genuinely part of contract.
        distilled_by: claude-haiku-4-5-20251001
    java:
        tags:
            - review
            - structural
            - java
        content: |-
            # Lens: Design & Architecture — Java

            ## Check
            - **SOLID & DI**: program to interfaces; inject dependencies (constructor
              injection / Spring) rather than `new`-ing collaborators or using static
              singletons; respect bean scopes.
            - **Package & module boundaries**: package-by-feature over package-by-layer
              where it reduces coupling; use JPMS / visibility to enforce; no cyclic
              package deps.
            - **Right type**: `record` for immutable data; `sealed` hierarchies to make
              illegal states unrepresentable; avoid anemic god-classes and deep
              inheritance (favor composition).
            - **Layering**: keep controllers thin; domain logic out of the persistence
              layer; don't leak JPA entities across the service boundary (use DTOs).
            - Watch leaky abstractions (e.g. returning `Optional` from fields, exposing
              mutable collections) that create connascence with callers.
        content_hash: sha256:534d2d8c57042679711348c3cdc059f977e7aa14275e1f8cec3a90cdd086be8d
        distilled: |-
            # Lens: Design & Architecture — Java

            ## Check
            - **SOLID & DI**: Interfaces + DI (constructor/Spring), not `new`/static singletons; respect bean scopes.
            - **Package & module boundaries**: Package-by-feature; JPMS/visibility enforce; no cycles.
            - **Right type**: `record` immutable; `sealed` unrepresentable states; no anemic gods, deep hierarchies—composition.
            - **Layering**: Thin controllers; domain ≠ persistence; no JPA entity leaks—use DTOs.
            - **Leaky abstractions**: Avoid `Optional` fields, mutable collections.
        distilled_by: claude-haiku-4-5-20251001
    kotlin:
        tags:
            - review
            - structural
            - kotlin
        content: |-
            # Lens: Design & Architecture — Kotlin

            ## Check
            - **Idiomatic structure**: `data class` / `data object` for data and stateless
              members; `sealed class`/`sealed interface` for closed hierarchies (illegal states
              unrepresentable); top-level functions over single-method utility classes.
            - **Dependency inversion**: interfaces + constructor injection; avoid
              `object` singletons holding mutable state.
            - **Boundaries**: `internal` visibility to scope module APIs; no package
              cycles; extension functions kept close to the type/feature they serve, not
              sprawled as a global junk drawer.
            - **Composition over inheritance**: delegation (`by`) for reuse; keep open
              classes deliberate (`final` by default is a feature).
            - Coroutine structure: scope/lifecycle ownership clear; don't leak
              `CoroutineScope` across architectural layers.
            - **KMP**: keep platform code behind `expect`/`actual` or DI at the `commonMain`
              boundary; no JVM-only APIs leaking into common.
        content_hash: sha256:fa98903a301241a1fa5791fdfae35e254134ed8d694d836651952a9ae42c3115
        distilled: |-
            # Lens: Design & Architecture — Kotlin

            ## Check
            - **Idiomatic structure**: `data class`/`data object` for data and stateless members; `sealed class`/`sealed interface` for closed hierarchies; top-level functions over utility classes.
            - **Dependency inversion**: interfaces + constructor injection; no mutable `object` singletons.
            - **Boundaries**: `internal` for module scope; no cycles; extensions co-located with their type.
            - **Composition over inheritance**: `delegation (by)` for reuse; `final` by default enforced.
            - **Coroutines**: scope/lifecycle clear; isolate `CoroutineScope` within layers.
            - **KMP**: `expect`/`actual` or DI at `commonMain` boundary; no JVM-only APIs in common.
        distilled_by: claude-haiku-4-5-20251001
    python:
        tags:
            - review
            - structural
            - python
        content: |-
            # Lens: Design & Architecture — Python

            ## Check
            - **Module/package layout**: clear public API (`__all__`, no reaching into
              another module's privates); no import cycles; avoid logic in `__init__.py`
              beyond re-exports.
            - **Dependency inversion**: depend on `Protocol`/ABC, not concrete classes;
              inject collaborators via constructor params rather than importing and
              instantiating inside methods.
            - **Right tool for the shape**: dataclass/`NamedTuple`/`TypedDict`/Pydantic
              model for data; module-level functions over a class with only one method;
              avoid god-classes and deep inheritance (favor composition/mixins sparingly).
            - **No hidden global state**: module-level mutable singletons and monkey-
              patching create strong connascence at a distance.
            - Framework boundaries (Django/Flask/FastAPI): keep business logic out of
              views/serializers; thin I/O layer, fat domain.
        content_hash: sha256:5256e008535e4450f2e5f15e435b10f9f0e995dac3051a1f1ee38ae1f811f6bd
        distilled: |-
            # Lens: Design & Architecture — Python

            ## Check
            - **Module/package layout**: clear public API (`__all__`, no private reaching); no import cycles; `__init__.py` re-exports only.
            - **Dependency inversion**: depend on `Protocol`/ABC, not concrete classes; inject via constructor, not import/instantiate in methods.
            - **Right tool for shape**: dataclass/`NamedTuple`/`TypedDict`/Pydantic for data; module functions over single-method classes; avoid god-classes, deep inheritance; favor composition sparingly.
            - **No hidden global state**: module-level mutables & monkey-patching = distance connascence.
            - **Framework boundaries** (Django/Flask/FastAPI): business logic out of views/serializers; thin I/O, fat domain.
        distilled_by: claude-haiku-4-5-20251001
    rust:
        tags:
            - review
            - structural
            - rust
        content: |-
            # Lens: Design & Architecture — Rust

            ## Check
            - **Ownership shapes the design**: model who owns what before reaching for
              `Rc<RefCell<>>`/`Arc<Mutex<>>`; shared mutability is a design smell, not a
              default.
            - **Traits for abstraction**: small, focused traits; prefer generics
              (static dispatch) for hot/lib paths and `dyn Trait` where runtime
              polymorphism is genuinely needed. Don't trait-ify single implementations.
            - **Module/crate boundaries**: `pub`/`pub(crate)` deliberately; workspace
              crates split by responsibility; no leaking internal types across the API.
            - **Make illegal states unrepresentable**: encode invariants in the type
              system (enums, newtypes, typestate) rather than runtime checks.
            - **Error type design**: `thiserror` for libraries (typed), `anyhow` for
              binaries; errors are part of the module contract.
            - Watch lifetime entanglement leaking into public signatures (2024-ed RPIT
              captures all in-scope lifetimes — narrow with `use<..>`) — often a sign the
              ownership boundary is in the wrong place.
        content_hash: sha256:19a355363451e6916108e6c582827814df7f0d30ddb120ce148384086aea1c41
        distilled: |-
            # Lens: Design & Architecture — Rust

            ## Check
            - **Ownership shapes design**: Model ownership before `Rc<RefCell<>>`/`Arc<Mutex<>>`. Shared mutability = design smell.
            - **Traits for abstraction**: Small, focused traits. Generics (static dispatch) for hot/lib paths; `dyn Trait` for runtime polymorphism when needed. Don't trait-ify single implementations.
            - **Module/crate boundaries**: Deliberate `pub`/`pub(crate)`. Split workspace by responsibility. No internal type leaks.
            - **Illegal states unrepresentable**: Encode invariants (enums, newtypes, typestate) in types, not runtime checks.
            - **Error type design**: `thiserror` (libs, typed); `anyhow` (binaries). Errors = module contract.
            - **Lifetimes**: Watch lifetime entanglement in public sigs. 2024 RPIT captures all in-scope; narrow with `use<..>`. Sign: ownership boundary misplaced.
        distilled_by: claude-haiku-4-5-20251001
    swift:
        tags:
            - review
            - structural
            - swift
        content: |-
            # Lens: Design & Architecture — Swift

            ## Check
            - **Value semantics first**: prefer `struct`/`enum` over `class` unless
              identity or reference sharing is required; this reduces shared-state
              coupling.
            - **Protocol-oriented design**: small protocols + protocol extensions for
              default behavior; avoid forcing class inheritance where a protocol fits.
            - **Make illegal states unrepresentable**: `enum` with associated values for
              modeling state; avoid optional-soup that pushes invariants to runtime.
            - **Module boundaries**: deliberate `public`/`internal`/`private`/
              `fileprivate`; keep view logic (SwiftUI/UIKit) out of the domain layer.
            - **Dependency injection** over singletons (`.shared`) for testability;
              watch retain cycles introduced by architectural references (delegates,
              closures) — `weak`/`unowned` where ownership demands.
        content_hash: sha256:d7bc84515452d37ba93b7c4887388310b800b1199c7aebde161ddf265f3bc8a3
        distilled: |-
            # Lens: Design & Architecture — Swift

            ## Check
            - **Value semantics first**: prefer `struct`/`enum` over `class` unless identity/reference-sharing required
            - **Protocol-oriented design**: small protocols + extensions for defaults; avoid class inheritance if protocol fits
            - **Make illegal states unrepresentable**: `enum` + associated values; avoid optional-soup
            - **Module boundaries**: deliberate `public`/`internal`/`private`/`fileprivate`; keep view logic (SwiftUI/UIKit) from domain layer
            - **Dependency injection** over singletons (`.shared`); manage retain cycles (delegates, closures) — `weak`/`unowned` per ownership model
        distilled_by: claude-haiku-4-5-20251001
    typescript:
        tags:
            - review
            - structural
            - typescript
        content: |-
            # Lens: Design & Architecture — TypeScript

            ## Check
            - **Module boundaries**: explicit exports (no barrel-file cycles); narrow
              public surface; `import type` for type-only deps to keep runtime graph
              clean.
            - **Types as the contract**: model domain with discriminated unions /
              `readonly` types; make illegal states unrepresentable; avoid `any` and
              unsafe casts that erode boundaries. Prefer `interface`/`type` over classes
              where data + functions suffice.
            - **Dependency inversion**: depend on interfaces, inject collaborators; avoid
              importing concrete singletons or reaching into module internals.
            - **Layer separation**: keep React components / route handlers thin; domain
              logic in framework-agnostic modules. No business rules in UI components.
            - Watch structural-typing surprises: accidental compatibility coupling two
              unrelated shapes; brand/opaque types where identity matters.
        content_hash: sha256:208ad42f5ac4a07467c57f5de0c6b1dbe81d6d5ae1881d58537181dad2df54ee
        distilled: |-
            # Lens: Design & Architecture — TypeScript

            ## Check
            - **Module boundaries**: explicit exports (no cycles); narrow surface; `import type` for type-only deps.
            - **Types as contract**: discriminated unions, `readonly` types; illegal states unrepresentable. Avoid `any`, unsafe casts. Prefer `interface`/`type` over classes.
            - **Dependency inversion**: interfaces + injection. Avoid concrete singletons, internal imports.
            - **Layer separation**: thin React/route handlers; domain logic framework-agnostic; no business rules in UI.
            - **Structural typing**: watch accidental compatibility. Brand/opaque types where identity matters.
        distilled_by: claude-haiku-4-5-20251001
