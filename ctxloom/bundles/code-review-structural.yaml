version: 1.0.0
tags:
    - review
    - structural
    - architecture
    - design
author: ctxloom
description: Design & architecture review lens (was 'architecture'). One language-agnostic `general` fragment plus per-language structural idioms. Compose `code-review-structural#fragments/general` with the project's language fragment (e.g. `#fragments/golang`) as a `ctxloom weave` member.
fragments:
    cpp:
        tags:
            - review
            - structural
            - cpp
        content: |-
            # Lens: Design & Architecture — C++

            ## Check
            - **RAII as the structural backbone**: ownership expressed through types
              (`unique_ptr`/`shared_ptr`/value types, not raw owning pointers); the Rule
              of Zero — let types compose rather than hand-writing special members.
            - **Header/translation-unit boundaries**: minimize header coupling (forward
              declarations, pimpl for ABI/compile-time isolation); no cyclic includes;
              avoid leaking implementation into public headers.
            - **Abstraction**: prefer concepts/templates (static polymorphism) on hot
              paths; use virtual interfaces where runtime dispatch is genuinely needed.
              Avoid deep virtual hierarchies; favor composition.
            - **Dependency direction**: depend on interfaces/abstract base or templates;
              inject rather than hard-wire singletons.
            - **Value semantics & const-correctness** as part of the contract; make
              illegal states hard to construct (strong types over bare primitives).
        content_hash: sha256:d4bf285d22865ead5d9c8f241842b7c0a802e8034370ce3d08129b2f8751f58a
        distilled: |-
            # Lens: Design & Architecture — C++

            ## Check
            - **RAII as structural backbone**: ownership through types (`unique_ptr`, `shared_ptr`, value types—not raw owning pointers); Rule of Zero—let types compose
            - **Header/translation-unit boundaries**: minimize coupling (forward decls, pimpl for ABI isolation); no cyclic includes; don't leak implementation
            - **Abstraction**: prefer concepts/templates (static polymorphism) on hot paths; virtual interfaces only where runtime dispatch needed; avoid deep hierarchies; favor composition
            - **Dependency direction**: depend on interfaces/abstractions/templates; inject—don't hard-wire singletons
            - **Value semantics & const-correctness**: contract requirement; make illegal states hard to construct (strong types > bare primitives)
        distilled_by: claude-haiku-4-5-20251001
    csharp:
        tags:
            - review
            - structural
            - csharp
        content: |-
            # Lens: Design & Architecture — C#

            ## Check
            - **SOLID & DI**: depend on interfaces; use the built-in DI container with
              correct lifetimes (singleton/scoped/transient); avoid service-locator and
              static mutable state.
            - **Right type**: `record`/`record struct` for immutable data; `sealed` by
              default; prefer composition over deep inheritance; avoid anemic models.
            - **Boundaries**: project/assembly layering enforces dependency direction
              (domain has no infra refs); `internal` + `InternalsVisibleTo` deliberately;
              no namespace/assembly cycles.
            - **Nullable reference types** enabled and honored at boundaries to encode
              contracts in the type system.
            - **Async all the way**: async crosses layer boundaries cleanly; don't bury
              sync-over-async (`.Result`/`.Wait()`) inside the architecture.
            - **AOT/trim awareness**: prefer the JSON source generator over reflection-based
              serialization if Native AOT/trimming is a target.
        content_hash: sha256:bf9dd21efe7c586508096ce27fb6a0d4410f4b562e4ba8159e7984a6320a2c8f
        distilled: |-
            # Lens: Design & Architecture — C#

            ## Check
            - **SOLID & DI**: Interfaces + DI (singleton/scoped/transient); no service-locator or static state.
            - **Right type**: `record`/`record struct` immutable; `sealed` default; composition > inheritance; no anemic models.
            - **Boundaries**: Assembly layering enforces dependency direction (domain → no infra); `internal` + `InternalsVisibleTo` deliberate; no cycles.
            - **Nullable reference types**: Enable & honor at boundaries; encode contracts in type system.
            - **Async all the way**: Clean async layer boundaries; never `.Result`/`.Wait()` in architecture.
            - **AOT/trim awareness**: JSON source generator over reflection if Native AOT/trimming targeted.
        distilled_by: claude-haiku-4-5-20251001
    general:
        tags:
            - review
            - structural
            - architecture
            - design
        content: |-
            # Lens: Design & Architecture

            Do the pieces fit the system, and will future changes stay cheap?

            ## Check
            - **Fit**: does this belong in this layer/module/service? Does it respect
              existing boundaries and dependency direction (no inward leaks)?
            - **SOLID** (concepts, any paradigm): single responsibility; open to
              extension without modifying callers; substitutable abstractions; narrow
              interfaces; depend on abstractions, not concretions.
            - **Cohesion & coupling**: related things together; minimal cross-module
              knowledge. Watch **connascence** — prefer weak/static forms (name, type)
              over strong/dynamic (position, meaning, execution order, timing); keep
              connascent code close; reduce the number of co-dependent sites.
            - **Extensibility vs over-engineering**: the hard-to-change-later decisions
              (schemas, wire formats, public contracts, vendor lock-in) get the most
              scrutiny; speculative generality (YAGNI) and SOLID weaponized into interface
              proliferation both get pushed back.

            Pair this with the project's language fragment for idiom-specific structural
            footguns.
        content_hash: sha256:734907c8330e106f36160b52986842062c8414b4a05478788012f9e3b4ed94d5
        distilled: |-
            # Lens: Design & Architecture

            Do pieces fit? Will changes stay cheap?

            ## Check
            - **Fit**: belongs here? Respects boundaries & dependency direction (no inward leaks)?
            - **SOLID** (any paradigm): single responsibility; open to extension without modifying callers; substitutable abstractions; narrow interfaces; depend on abstractions, not concretions.
            - **Cohesion & coupling**: related code together; minimal cross-module knowledge. Prefer weak connascence (name, type) over strong (position, meaning, execution order, timing); keep connascent code close; reduce co-dependent sites.
            - **Extensibility vs over-engineering**: hard-to-change-later decisions (schemas, wire formats, public contracts, vendor lock-in) scrutinized; reject speculative generality (YAGNI) and interface proliferation.

