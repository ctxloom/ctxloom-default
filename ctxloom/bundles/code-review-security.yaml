        content: |-
            # Lens: Security (OWASP Top 10:2025 / ASVS 5.0)

            Does the change protect data and resist abuse?

            ## Check
            - **Access control**: every privileged action is authorized server-side;
              deny by default; no object-level IDOR (acting on IDs without an owner
              check).
            - **Injection / output encoding**: untrusted input never reaches an
              interpreter unescaped — parameterized queries (SQLi), context-aware
              encoding (XSS), no shell/`eval`/template injection.
            - **Secrets & crypto**: no hard-coded credentials/keys/tokens; strong,
              standard algorithms; secure randomness; data encrypted in transit/at rest.
            - **Secure design**: SSRF (validate/allow-list outbound URLs); safe
              deserialization; least privilege; safe-by-default config.
            - **AuthN/session**: token expiry, no session fixation, MFA paths intact.
            - Memory safety in unsafe/native code (bounds, use-after-free).

            Flag concrete, exploitable issues with the attack in mind — not generic
            "add validation" notes.
        content_hash: sha256:08ae0b3c455041ba48489b245d14f9de753e311584750e6338379d1e5c07635f
