fragments:
    general:
        tags:
            - review
            - dx
            - library
        content: |-
            # Lens: Developer Experience (libraries / SDKs / tooling)

            How does it feel to *use* this as a calling developer?

            ## Check
            - Principle of least surprise; good, safe defaults; minimal required
              boilerplate to do the common thing.
            - Errors aimed at the caller: actionable messages, the right error
              types/codes, no leaking internals.
            - Discoverability: clear names, examples in docs, sensible zero-config path.
            - Hard to use incorrectly (types/builders guide correct usage).
