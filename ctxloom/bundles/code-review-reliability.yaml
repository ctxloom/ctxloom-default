    general:
        tags:
            - review
            - reliability
            - concurrency
            - error-handling
        content: |-
            # Lens: Reliability, Errors & Concurrency

            Does it fail safely and stay correct under failure and concurrency?

            ## Check
            - **Errors**: handled, not swallowed; meaningful context propagated; errors
              not used for normal control flow.
            - **Resource cleanup on every path** (including errors/early returns):
              files, handles, connections, locks.
            - **Fault tolerance**: timeouts on all I/O; retries with backoff+jitter, idempotency,
              and a **retry budget / token bucket** — coordinate retry policy across layers to
              avoid retry storms; circuit breakers/fallbacks (mind their modal behavior, often
              better at the platform/mesh layer); degrade rather than crash.
            - **Concurrency**: shared mutable state confined, immutable, or lock-guarded;
              consistent lock ordering (deadlock); atomic compound updates; no data races;
              cancellation/context propagation.

            Pair with the project's language fragment for its cleanup and concurrency
            model. (True races need a race detector / runtime confirmation — flag
            candidates.)
        content_hash: sha256:0634823cbc1fe6daa3a8ab9e6c470b5822c1934e27f742a643e5e68ad64dc046
        distilled: |-
            # Lens: Reliability, Errors & Concurrency

            Fails safely; correct under failure/concurrency?

            ## Check
            - **Errors**: handled (not swallowed); meaningful context propagated; not for control flow
            - **Cleanup**: all paths (errors/early returns) — files, handles, connections, locks
            - **Fault tolerance**: I/O timeouts; retries (backoff+jitter, idempotency); retry budget/token bucket; cross-layer coordination; circuit breakers/fallbacks; degrade
            - **Concurrency**: mutable state (confined/immutable/locked); consistent lock ordering; atomic updates; no races; cancellation/context propagation

            Pair w/ language fragment for cleanup/concurrency model. Flag races for detector.
        distilled_by: claude-haiku-4-5-20251001
    golang:
        tags:
            - review
            - reliability
            - go
        content: |-
            # Lens: Reliability — Go

            ## Check
            - **`defer`** for cleanup; watch defer-in-loop accumulation and that args
              are evaluated at `defer` time.
            - **Don't drop errors** (`_ =`); wrap with `%w`; `errors.Join` for multi-error
              aggregation.
            - **`context`** deadline/cancellation propagated through call chains and
              respected in loops/`select`; `context.AfterFunc`/`WithoutCancel` for
              cleanup-after-cancel.
            - **Goroutine leaks**: every goroutine needs a guaranteed exit (ctx/done).
            - **Channels**: the sender closes (once); a nil channel blocks forever;
              never send on a closed channel.
            - **Data races**: guard shared state (`sync.Mutex`; don't copy a held
              mutex); `sync.OnceFunc`/`OnceValue` over hand-rolled `sync.Once`; run tests
              with `-race`.
        content_hash: sha256:ca5e041d1a92820b6bc5ac1d80e56b3447088eeb6329e1e98a04c1468b14639a
        distilled: |-
            # Lens: Reliability — Go

            ## Check
            - **`defer`**: cleanup; defer-in-loop accumulation; args eval at defer time
            - **Errors**: never drop (`_ =`); wrap `%w`; `errors.Join` multi-error
            - **`context`**: deadline/cancel through chains, loops/`select`; `context.AfterFunc`/`WithoutCancel` for cleanup
            - **Goroutines**: guaranteed exit (ctx/done)
            - **Channels**: sender closes (once); nil blocks forever; never send closed
            - **Data races**: guard shared state (`sync.Mutex`; never copy held); prefer `sync.OnceFunc`/`OnceValue` over `sync.Once`; test `-race`
        distilled_by: claude-haiku-4-5-20251001
    java:
        tags:
            - review
            - reliability
            - java
        content: |-
            # Lens: Reliability — Java

            ## Check
            - **try-with-resources** for `AutoCloseable`; `finally` otherwise.
            - **Don't swallow** exceptions; preserve the cause; respect interrupts.
            - **Virtual threads** (Java 21+) for I/O-bound concurrency
              (`newVirtualThreadPerTaskExecutor`) — one VT per task, never pool/reuse; prefer
              **scoped values** (final in 25) over `ThreadLocal`. (Structured concurrency is
              still preview → JDK 27 — don't treat it as settled.)
            - **Concurrency**: `java.util.concurrent` over hand-rolled locks;
              `volatile`/atomics for visibility; immutability for safety.
            - **Shut down `ExecutorService`s**; observe `Future`/`CompletableFuture`
              exceptions.
            - Watch `ConcurrentModificationException`, deadlock via lock ordering, and
              broken double-checked locking.
        content_hash: sha256:3e0dd75663df94e6367f9fac0b810f0c20ebf9bf6f411b47171a26918a0f40a5
        distilled: |-
            # Lens: Reliability — Java

            ## Check
            - **try-with-resources** `AutoCloseable`; `finally` otherwise
            - Don't swallow exceptions; preserve cause; respect interrupts
            - **Virtual threads** (Java 21+): `newVirtualThreadPerTaskExecutor`, 1/task, no pooling. Prefer **scoped values** (final in 25) over `ThreadLocal` (preview → JDK 27)
            - **Concurrency**: `java.util.concurrent` > hand-rolled; `volatile`/atomics; immutability
            - Shut down `ExecutorService`s; observe `Future`/`CompletableFuture` exceptions
            - Watch: `ConcurrentModificationException`, deadlock, double-checked locking bugs
        distilled_by: claude-haiku-4-5-20251001
    kotlin:
        tags:
            - review
            - reliability
            - kotlin
        content: |-
            # Lens: Reliability — Kotlin

            ## Check
            - **`use {}`** for closeables; `try/finally` otherwise.
            - **Structured concurrency**: cancellation is cooperative — check
              `isActive`/`ensureActive` in loops; never swallow `CancellationException`.
            - **Scope choice**: `coroutineScope` (fail-fast) vs `supervisorScope`
              (isolate child failures) — pick deliberately.
            - **Don't block** a coroutine thread; use the right `Dispatcher`.
            - JVM thread-safety rules still apply to shared mutable state.
        content_hash: sha256:5ef39af7b807a024bc2dc5286769b2c41ca826ea46932c30a62c60442e071f97
        distilled: |-
