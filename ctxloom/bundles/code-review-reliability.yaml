            - **Shared mutable state**: `Arc<Mutex<>>`/`RwLock`; handle `std` poisoning (`parking_lot`/`tokio` don't poison).
            - **2024 edition**: `static mut` is error — use `&raw const`/`&raw mut`.
            - **Async cancellation**: dropping future cancels it — ensure no half-completed critical sections.
            - `panic` unwinds — catch at thread/task boundary.
