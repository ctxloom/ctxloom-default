        content: |-
            # Lens: Reliability, Errors & Concurrency

            Does it fail safely and stay correct under failure and concurrency?

            ## Check
            - **Errors**: handled, not swallowed; meaningful context propagated; errors
              not used for normal control flow.
            - **Resource cleanup on every path** (including errors/early returns):
              files, handles, connections, locks.
            - **Fault tolerance**: timeouts on all I/O; retries with backoff+jitter, idempotency,
              and a **retry budget / token bucket** — coordinate retry policy across layers to
              avoid retry storms; circuit breakers/fallbacks (mind their modal behavior, often
              better at the platform/mesh layer); degrade rather than crash.
            - **Concurrency**: shared mutable state confined, immutable, or lock-guarded;
              consistent lock ordering (deadlock); atomic compound updates; no data races;
              cancellation/context propagation.

            Pair with the project's language fragment for its cleanup and concurrency
            model. (True races need a race detector / runtime confirmation — flag
            candidates.)
