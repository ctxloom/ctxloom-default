    swift:
        tags:
            - review
            - reliability
            - swift
        content: |-
            # Lens: Reliability — Swift

            ## Check
            - **`defer`** for cleanup; `do/catch`; consider **typed throws** (`throws(E)`,
              Swift 6) at stable API boundaries, untyped internally where error modes evolve.
            - **ARC leaks**: break retain cycles with `weak`/`unowned` in closures and
              delegates.
            - **Concurrency**: Swift 6 enforces data-race safety at compile time. In 6.2
              projects default isolation is `@MainActor` — flag work that should leave it
              (`@concurrent` / hop to an actor); `actor`s isolate shared mutable state;
              `Sendable` across isolation boundaries.
            - **Cancellation**: cooperative — call `Task.checkCancellation()`; structured
              tasks (`async let`, task groups) propagate errors.
        content_hash: sha256:7a8a1dd000bf4fe4b1ff432c283fb8659ab551d5eb568ac00a318ae8f7a3473b
        distilled: |-
            # Lens: Reliability — Swift

            ## Check
            - **`defer`** cleanup; `do/catch`; **typed throws** (`throws(E)`) at stable API boundaries
            - **ARC**: break cycles with `weak`/`unowned` in closures, delegates
            - **Concurrency**: Swift 6 compile-time data-race safety. Default `@MainActor` (6.2+)—flag non-Main work. `actor`s isolate state; `Sendable` across boundaries
            - **Cancellation**: cooperative; `Task.checkCancellation()`; structured tasks propagate errors
        distilled_by: claude-haiku-4-5-20251001
    typescript:
        tags:
            - review
            - reliability
            - typescript
        content: |-
            # Lens: Reliability — TypeScript / JS

            ## Check
            - **No floating promises**: every promise is awaited or explicitly handled;
              unhandled rejections leak/crash.
            - **`try/finally`** — or `using`/`await using` (`Symbol.dispose`/`asyncDispose`,
              TS 5.2+) for deterministic cleanup; `clearTimeout`/close handles.
            - **`Promise.all` fails fast**; use `allSettled` when partial success is
              valid.
            - **Cancellation** via `AbortController`/signal propagation.
            - Single-threaded event loop means no data races, but **async-ordering
              races** are real (interleaved awaits mutating shared state).
            - Don't bury errors in an empty `.catch(() => {})`.
        content_hash: sha256:fda540840e6008a3adafa108c36d7ebbe3e97429f861a4dd5a6a6a45886e9e90
        distilled: |-
            # Lens: Reliability — TypeScript / JS

            ## Check
            - **No floating promises**: await all or handle explicitly; unhandled rejections crash
            - **`try/finally`** or `using`/`await using` (`Symbol.dispose`/`asyncDispose`) for cleanup; clear timeouts/close handles
            - **`Promise.all` fails fast**; use `allSettled` when partial success valid
            - **Cancellation**: `AbortController`/signal propagation
            - **Async-ordering races**: interleaved awaits mutate shared state
            - Never use empty `.catch(() => {})` — buries errors
        distilled_by: claude-haiku-4-5-20251001
