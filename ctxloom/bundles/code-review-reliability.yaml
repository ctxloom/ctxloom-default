version: 1.0.0
tags:
    - review
    - reliability
    - concurrency
    - error-handling
author: ctxloom
description: Reliability, error-handling & concurrency review lens. Language-agnostic `general` fragment plus each language's cleanup and concurrency model. Compose `code-review-reliability#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    cpp:
        tags:
            - review
            - reliability
            - cpp
        content: |-
            # Lens: Reliability — C++

            ## Check
            - **RAII for every resource** — the core safety mechanism; smart pointers,
              not raw owning pointers; no manual `new`/`delete` pairs.
            - **Errors-as-values**: `std::expected<T,E>` (C++23) for recoverable failures —
              reserve exceptions for the exceptional; state the exception guarantee
              (basic/strong/nothrow) and mark non-throwing code `noexcept`.
            - **Lifetime bugs**: use-after-free, dangling references, double-free. Build with a
              **hardened stdlib** (`_LIBCPP_HARDENING_MODE`) to trap OOB on `vector`/`span`/`string`.
            - **Concurrency**: data races are UB — `std::atomic`/mutexes; `std::scoped_lock`
              for multiple locks (deadlock avoidance); prefer **`std::jthread`** (auto-join +
              `stop_token`) over a bare `std::thread`.
        content_hash: sha256:7e4588fff1b234962c7ead851c7d517d2f8e0c36aea3162054ea6512d7c90c9e
        distilled: |-
            # Lens: Reliability — C++

            ## Check
            - **RAII every resource** — smart pointers (not raw owning); no `new`/`delete`.
            - **Errors-as-values**: `std::expected<T,E>` (C++23). State exception guarantee (basic/strong/nothrow); mark `noexcept`.
            - **Lifetime bugs**: use-after-free, dangling refs, double-free. Build w/ hardened stdlib (`_LIBCPP_HARDENING_MODE`) to trap OOB.
            - **Concurrency**: data races = UB. `std::atomic`, mutexes. `std::scoped_lock` for multi-lock. Prefer `std::jthread` (auto-join, `stop_token`) over `std::thread`.
        distilled_by: claude-haiku-4-5-20251001
    csharp:
        tags:
            - review
            - reliability
            - csharp
        content: |-
            # Lens: Reliability — C#

            ## Check
            - **`using`/`IDisposable`** (and `IAsyncDisposable`) for deterministic
              cleanup.
            - **Async hygiene**: no `async void` (except event handlers); `.Result`/`.Wait()`
              deadlocks only where a `SynchronizationContext` exists (UI / legacy ASP.NET, not
              ASP.NET Core) — but still avoid sync-over-async; `ConfigureAwait(false)` in
              context-agnostic libraries.
            - **`CancellationToken`** threaded through and honored.
            - **Concurrency**: `System.Threading.Lock` (C# 13) over `lock(object)`;
              `Interlocked`/concurrent collections; observe `Task` exceptions (unobserved are
              lost).
        content_hash: sha256:ccf8f482d2e6d569df6eb1bfbc3f932509b3bbf20837f4b2a3b18f51f7e00882
        distilled: |-
            # Lens: Reliability — C#

            ## Check
            - **`using`/`IDisposable`** & `IAsyncDisposable` for deterministic cleanup
            - **Async hygiene**: no `async void` except event handlers; avoid `.Result`/`.Wait()` & sync-over-async; `ConfigureAwait(false)` in libraries
            - **`CancellationToken`** threaded & honored
            - **Concurrency**: `System.Threading.Lock` (C# 13) over `lock(object)`; `Interlocked`/concurrent collections; observe `Task` exceptions (unobserved lost)
