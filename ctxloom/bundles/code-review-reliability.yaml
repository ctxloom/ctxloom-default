    python:
        tags:
            - review
            - reliability
            - python
        content: |-
            # Lens: Reliability — Python

            ## Check
            - **`with`/context managers** (or `try/finally`) for files, sockets, locks,
              sessions.
            - **Don't swallow** with bare `except`; chain with `raise ... from e`.
            - **Concurrency model**: a GIL build serializes CPU — use `multiprocessing`, or
              threads on a free-threaded build (3.13t/3.14t, now officially supported); asyncio
              is concurrency, not CPU parallelism. Guard shared state with locks.
            - **Free-threaded build**: no GIL means latent data races surface —
              read-modify-write on a shared dict/list/counter is no longer accidentally atomic;
              lock it.
            - **asyncio**: handle `CancelledError`, surface `gather` exceptions, and put
              no blocking calls in the event loop.
            - Ensure pool/executor exceptions are observed, not silently lost.
        content_hash: sha256:7254338713254d91d180711c2beb9c2a7a987c50db650b23073162ea828a3a7a
        distilled: |-
            # Lens: Reliability — Python

            ## Check
            - **`with`/context managers** (or `try/finally`): files, sockets, locks, sessions
            - **Never bare `except`**: chain with `raise ... from e`
            - **GIL**: CPU-serialized; use `multiprocessing` or free-threaded (3.13t/3.14t); asyncio = concurrency-only. Lock shared state.
            - **Free-threaded**: no GIL surfaces data races; read-modify-write on shared dict/list/counter not atomic; lock it
            - **asyncio**: handle `CancelledError`, surface `gather` exceptions, no blocking calls in event loop
            - Observe pool/executor exceptions (don't lose silently)
        distilled_by: claude-haiku-4-5-20251001
    rust:
        tags:
            - review
            - reliability
            - rust
        content: |-
            # Lens: Reliability — Rust

            ## Check
            - **RAII/`Drop`** handles cleanup; `?` propagates; avoid `unwrap` in
              libraries.
            - **Compiler prevents data races** via `Send`/`Sync` — but logical races and
              **deadlocks** remain (consistent lock ordering; don't hold a lock across
              `.await`).
            - **Shared mutable state**: `Arc<Mutex<>>`/`RwLock`; handle `std` lock poisoning
              (`parking_lot`/`tokio` mutexes don't poison).
            - **2024 edition**: `static mut` references are a hard error — use `&raw const`/
              `&raw mut`.
            - **Async cancellation**: dropping a future cancels it — ensure that leaves
              no half-completed critical section.
            - `panic` unwinds — decide whether to catch at a thread/task boundary.
        content_hash: sha256:86d7a3519f45a8f3dddabb9a36dbc026445fb722d6a2a0a536a8f86061d0b711
        distilled: |-
