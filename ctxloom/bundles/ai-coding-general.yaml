fragments:
    concurrency-warnings:
        content: |
            # Concurrency Warnings

            AI-authored code is approximately 2x more likely to make concurrency and dependency-correctness mistakes than human-only code (CodeRabbit, *State of AI vs Human Code Generation*, 2025; 470 PRs analyzed, ~1.7x more issues overall, concurrency a leading subcategory).

            ## Race Condition Reintroduction

            AI may "optimize" sequential→parallel, reintroducing bugs.

            ```javascript
            // SYNC-REQUIRED: email needs user.id from save
            await saveUser(user);
            await sendEmail(user);

            // AI BUG: await Promise.all([saveUser, sendEmail])
            ```

            **Protection:** Comment `// SYNC-REQUIRED: [reason]`

            ## Common Mistakes

            ### Go
            - No shutdown: `go doWork()` → errgroup + context
            - Channel overuse for state → mutex
            - Missing ctx → always pass context.Context

            ### JavaScript/TypeScript
            - Lost errors: unhandled rejection → handle/propagate
            - Memory leaks: listeners without cleanup → remove in cleanup

            ### Rust
            - Blocking in async: `std::thread::sleep` → `tokio::time::sleep`
            - Unnecessary Arc<Mutex> → message passing

            ## Review Checklist
            (See human-review-checklist for full list)
            - Every goroutine/thread has shutdown path
            - Context cancellation propagated
            - Async errors handled
            - No blocking in async
            - Sequential code not parallelized
