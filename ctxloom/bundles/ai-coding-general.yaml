    mutation-as-test-validator:
        content: |
            # Mutation Testing as a Test Validator

            Passing tests are not proof that tests are good. Mutation testing is the deterministic check.

            ## What It Does

            1. Mutates source code (flip `>` to `>=`, return early, change return value)
            2. Runs the test suite against each mutant
            3. Reports survivors: mutants the tests did not kill

            A surviving mutant means the test suite accepts demonstrably wrong code. The test covers the line but does not verify the behavior.

            ## Why It Matters for LLM-Written Tests

            LLMs produce plausible-looking tests at scale. "Plausible" is not "meaningful." Failure modes mutation testing catches:

            - **Tautological assertions**: `assert_eq!(result, calculate(5, 3))` always passes; mutants survive
            - **Missing edge cases**: tests happy path, leaves mutation gaps at boundaries
            - **Implementation-coupled tests**: kills the wrong mutants; brittle to refactor, blind to real bugs

            ## Workflow Integration

            After the TDD round-trip:

            1. LLM writes tests
            2. You review tests
            3. LLM implements
            4. **Run mutation testing**
            5. Analyze survivors: which behaviors are not actually tested?
            6. Add tests that kill survivors, or accept the gap explicitly

            ## Tools

            - Rust: `cargo-mutants`
            - Java: `pitest`
            - Python: `mutmut`, `cosmic-ray`
            - JS/TS: `stryker`
            - Go: `gomutation`, `go-mutesting`

            ## Target Kill Rates

            | Code shape | Target |
            |---|---|
            | Pure utility functions | 80-90%+ |
            | Business logic | 80-90% |
            | Framework glue delegating to tested core | 60-70% |
            | Logging-only paths | survivors acceptable |

            Teams with 80-90% code coverage routinely discover 30% mutation kill rates on first adoption. Coverage measures execution; mutation testing measures verification.

            ## Anti-Patterns

            - Treating high code coverage as test quality.
            - Killing a surviving mutant by adding `assert!(true)` adjacent to the line. Score goes up; signal goes to zero.
