            - f-strings, `__main__` guard, duck typing/Protocol; lazy annotations (PEP 649, 3.14 via annotationlib, not `__annotations__`)
            - Type-check: mypy/pyright/ruff; pyproject.toml (distutils gone 3.12); **uv** preferred
