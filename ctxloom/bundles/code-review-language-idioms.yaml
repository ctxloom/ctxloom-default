    kotlin:
        tags:
            - review
            - idioms
            - kotlin
        content: |-
            # Lens: Idioms — Kotlin

            ## Check
            - **Null-safety** as a first-class tool; `val`/immutability by default; K2 is the
              only compiler — flag `language-version` pins below 2.0.
            - `data`/`sealed` classes, `data object` for stateless members, `when` with guard
              conditions (`is X if …`), named/default args, extension functions, delegation (`by`).
            - **Coroutines** for async; `sequence` for lazy pipelines; explicit backing fields
              (`field =`) over `_state`/`state` mirror properties.
            - Idiomatic collection operators; smart casts; context parameters (Stable 2.4) for
              scoped deps — use sparingly, don't hide critical dependencies.
        content_hash: sha256:b415746e1a7e763857469ab044f5d3286a842de199378f2f6bd74bc025c95b0c
        distilled: |-
            # Lens: Idioms — Kotlin

            ## Check
            - **Null-safety** (first-class); `val`/immutability default; K2 only; `language-version` pins <2.0.
            - `data`/`sealed` classes, `data object` (stateless), `when` + guards (`is X if …`), named/default args, extension functions, delegation (`by`).
            - **Coroutines** (async); `sequence` (lazy); explicit backing fields (`field =`) — avoid `_state`/`state` patterns.
            - Collection operators, smart casts, context parameters (Stable 2.4) — use sparingly, never hide critical deps.
        distilled_by: claude-haiku-4-5-20251001
    python:
        tags:
            - review
            - idioms
            - python
        content: |-
            # Lens: Idioms — Python

            ## Check
            - **PEP 8** + **EAFP** (try/except) over LBYL where idiomatic.
            - Idiomatic constructs: comprehensions/generators, context managers, dunder
              methods, `enumerate`/`zip`, `pathlib`, `dataclasses`/`enum`; **PEP 695** inline
              generics (`class C[T]`, `type` aliases); stdlib `tomllib` for config.
            - **f-strings**; `__main__` guard; duck typing / `typing.Protocol`; annotations are
              lazy (PEP 649, 3.14) — read via `annotationlib`, not raw `__annotations__`.
            - Type-checked (mypy/pyright/ty) + `ruff` (lint+format, not a type checker);
              `pyproject.toml` packaging (`distutils` gone in 3.12); **`uv`** preferred env/runner.
        content_hash: sha256:5e7ff3feb3d87a20989a7fa84ddeef0f6ab20b11439b70463b7a03a94f965095
        distilled: |-
