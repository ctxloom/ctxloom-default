    typescript:
        tags:
            - review
            - idioms
            - typescript
        content: |-
            # Lens: Idioms — TypeScript

            ## Check
            - **`strict` mode**; model with discriminated unions; `unknown` over `any`;
              type guards/narrowing.
            - Utility types (`Partial`/`Pick`/`Record`), `readonly`/`as const`, `const` type
              params, `satisfies` for safe inference; prefer union literals/`as const` over `enum`.
            - **ES modules**, `async/await`, nullish coalescing / optional chaining;
              `erasableSyntaxOnly` — avoid runtime-emitting syntax (enums/namespaces) so it runs
              under native Node TS execution.
            - Tooling: `eslint` (flat config) + `prettier` or **Biome**; `tsc`/`tsgo` (TS 7
              native) in strict mode.
        content_hash: sha256:c0d1b9eebc3fb60bbe2fe9c13ea6497bf90997c5f2068b78a8f9ee1567430d96
