    swift:
        tags:
            - review
            - idioms
            - swift
        content: |-
            # Lens: Idioms — Swift

            ## Check
            - **Optionals + `guard`**; value types and **protocol-oriented** design; noncopyable
              `~Copyable` (`borrowing`/`consuming`) for unique-ownership resources.
            - `enum` with associated values; extensions; `Result`; `Codable`; property wrappers;
              macros (`@attached`/freestanding) judiciously; `@Observable` over `ObservableObject`.
            - **API Design Guidelines**: names read as phrases at the call site.
            - Trailing closures, `defer`, deliberate access control, `some`/`any`.
        content_hash: sha256:2ef89759465d2e1fe8c7bf6050e90f0b1bfbac658f445a86e1990cf6b2e54904
