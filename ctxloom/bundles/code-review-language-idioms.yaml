        distilled_by: claude-haiku-4-5-20251001
    golang:
        tags:
            - review
            - idioms
            - go
        content: |-
            # Lens: Idioms — Go

            ## Check
            - **Errors are values**: return/wrap them (`%w`, `errors.Is`/`As`, `errors.Join`,
              sentinel/typed errors); no exceptions-style control flow.
            - **Accept interfaces, return structs** (a guideline, not dogma); keep interfaces
              small and consumer-defined.
            - **`context.Context` as the first param** for cancelable/IO work.
            - Idiomatic constructs: `iota` enums, `defer` cleanup, no getters/setters, channels
              for coordination; `log/slog` for structured logging; `min`/`max`/`clear` +
              `slices`/`maps`/`cmp`; `iter.Seq` range-over-func (1.23) over channel generators.
            - Tooling: `gofmt`, `go vet`, `golangci-lint` (v2 schema); keep `go fix`/gopls
              `modernize` clean — leftover legacy patterns are a review smell.
        content_hash: sha256:5563b56e1297824781beab8ff2b495c093ad7c089068dcb2ef705171ae50193c
        distilled: |-
            # Lens: Idioms — Go

            ## Check
            - **Errors are values**: wrap with `%w`, `errors.Is`/`As`/`Join`, sentinel/typed; no exception control flow.
            - **Accept interfaces, return structs**; small, consumer-defined interfaces.
            - **`context.Context` first param** for cancelable/IO.
            - Idioms: `iota` enums, `defer` cleanup, no getters/setters, channels, `log/slog`, `min`/`max`/`clear`, `slices`/`maps`/`cmp`, `iter.Seq` range-over-func (1.23).
            - Tools: `gofmt`, `go vet`, `golangci-lint` (v2), `go fix`/gopls `modernize`; legacy patterns = review flag.
        distilled_by: claude-haiku-4-5-20251001
    java:
        tags:
            - review
            - idioms
            - java
        content: |-
            # Lens: Idioms — Java

            ## Check
            - **Modern Java** (21/25 LTS): `record`s + record-pattern deconstruction, `sealed`
              hierarchies, pattern matching for `switch`, sequenced collections, stream gatherers,
              `var` locals.
            - `Optional` for return values (a convention, not for fields/params); streams where
              they clarify; **virtual threads** for I/O concurrency.
            - `equals`/`hashCode` together; enums with behavior; `java.time`; builders.
            - Constructor injection; disciplined checked-exception use. (String templates were
              withdrawn in JDK 23 — don't use them.)
        content_hash: sha256:b7c58f5bd9f2f1a58d9f77575600feedd771059059401b384b64f3f7d125929d
        distilled: |-
