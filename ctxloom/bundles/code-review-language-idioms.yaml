    rust:
        tags:
            - review
            - idioms
            - rust
        content: |-
            # Lens: Idioms — Rust

            ## Check
            - **Ownership & borrowing** over cloning; `Result`/`Option` + `?`; no
              `unwrap`/`panic` in library code.
            - **Match-based** flow; iterators over manual loops; `derive` and newtypes.
            - **Error model**: `thiserror` for libraries, `anyhow`/`eyre` for applications.
            - **Edition 2024** norms: async-fn-in-trait/RPITIT stable but not `dyn`-safe
              (`#[trait_variant]`/`async-trait` for `dyn`); `static mut` references are a hard
              error (use `&raw`).
            - Make illegal states unrepresentable; declare `rust-version` (MSRV); `clippy` +
              `rustfmt`; `#[expect(reason=…)]` over `#[allow]`; centralize lints in `[lints]`.
        content_hash: sha256:a9cc5b58fd0f4edd2cb5ec44c879dcf85bb89052d5a7eabf44afaf3dbbe9806c
        distilled: |-
