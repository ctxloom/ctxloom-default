author: ctxloom
description: Language idioms & best-practices review lens. A thin `general` framing plus a rich per-language fragment (ecosystem conventions, error model, tooling, idiomatic constructs). Compose `code-review-language-idioms#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    cpp:
        tags:
            - review
            - idioms
            - cpp
        content: |-
            # Lens: Idioms — C++

            ## Check
            - **RAII** and the **Rule of Zero/Five**; smart pointers over raw owning
              pointers; `const`-correctness.
            - **`std::ranges`/`views`** over hand-rolled loops; `std::print`/`std::format` over
              iostream/`printf`; `std::expected` (C++23) for errors-as-values; move semantics;
              `auto` judiciously.
            - `constexpr`, templates/concepts, uniform initialization, `nullptr`; `import std;`
              is available but adoption is still cautious in 2026.
            - Prefer `std::` over C equivalents; build with a **hardened stdlib**; follow the
              Core Guidelines. (C++26 added hardened stdlib + contracts but NOT lifetime/borrow
              safety — "Safe C++" rejected, profiles deferred to C++29.)
        content_hash: sha256:b9b5157407c02b3e648cb34d21238a780649cc30f4998b0d9355a7749f7d0d57
        distilled: |-
            # Lens: Idioms — C++

            ## Check
            - **RAII**, **Rule of Zero/Five**; smart pointers vs. raw pointers; `const`-correctness
            - **`std::ranges`/`views`** vs. hand-rolled loops; **`std::print`/`std::format`** vs. iostream/`printf`; **`std::expected`** (C++23); move semantics; `auto`
            - `constexpr`, templates/concepts, uniform initialization, `nullptr`; `import std;` available
            - Prefer `std::` over C; hardened stdlib; Core Guidelines
            - C++26: hardened stdlib + contracts; safety profiles deferred to C++29
        distilled_by: claude-haiku-4-5-20251001
    csharp:
        tags:
            - review
            - idioms
            - csharp
        content: |-
            # Lens: Idioms — C#

            ## Check
            - Properties over public fields; **LINQ**; **async/await** end to end.
            - Modern C# (12–14): collection expressions `[…]`, primary constructors (note: their
              params are mutable, not auto-properties), the `field` keyword, extension members,
              `params` collections, `record`s, pattern matching/switch expressions, nullable
              reference types, target-typed `new`, `using` declarations.
            - `IEnumerable`/`yield`; events/delegates; constructor DI.
            - Expression-bodied members; `IDisposable` for resources.
        content_hash: sha256:f370d3d9aee1a0368fbc220fcc6e2ccb2dee18021aac27bfe50295c033dc0fd0
        distilled: |-
            # Lens: Idioms — C#

            ## Check
            - Properties over fields; **LINQ**; **async/await**.
            - C# 12–14: collection `[…]`, primary ctors (⚠ mutable params ≠ auto-props), `field`, extensions, `params`, `record`s, pattern/switch, nullable refs, target `new`, `using`.
            - `IEnumerable`/`yield`, events/delegates, DI.
            - Expression members, `IDisposable`.
        distilled_by: claude-haiku-4-5-20251001
    general:
        tags:
            - review
            - idioms
            - best-practices
        content: |-
            # Lens: Language Idioms & Best Practices

            Is the code idiomatic for its language and ecosystem? This lens carries the
            language specifics — pair the project's language fragment.

            ## Concept
            - Use the language's idiomatic constructs and standard library rather than
              transliterating from another language.
            - Follow the ecosystem's accepted conventions, error model, and tooling.
            - Avoid the language's known anti-patterns and footguns.
        content_hash: sha256:78ebe84d7ca7a5f2330c85773bda3b03baa52cb38cb843890d06b46b1de7a6cc
        distilled: |-
