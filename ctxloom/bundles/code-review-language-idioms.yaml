        - idioms
        - best-practices
        content: |-
            # Lens: Language Idioms & Best Practices

            Is the code idiomatic for its language and ecosystem? This lens carries the
            language specifics — pair the project's language fragment.

            ## Concept
            - Use the language's idiomatic constructs and standard library rather than
              transliterating from another language.
            - Follow the ecosystem's accepted conventions, error model, and tooling.
            - Avoid the language's known anti-patterns and footguns.
