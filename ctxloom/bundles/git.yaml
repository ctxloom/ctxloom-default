description: "Git practices for branching, commits, hooks, and version control workflows"

fragments:
  git:
    tags:
      - git
      - workflow
    installation: |-
      Add submodule write-protection to `.claude/settings.json` so the harness enforces the policy rather than relying on prompt guidance alone:

      ```json
      {
        "permissions": {
          "deny": [
            "Bash(git submodule*)",
            "Bash(git -c * submodule*)",
            "Edit(.gitmodules)",
            "Write(.gitmodules)"
          ]
        }
      }
      ```

      For each path returned by `git submodule status`, also add `Edit(<path>/**)` and `Write(<path>/**)` deny entries so direct file edits inside a submodule are blocked.

      To perform a one-time approved submodule write, remove the relevant deny rule, execute the change, then restore the rule. Do not leave deny rules disabled.
    content: |-
      # Git Practices

      ## Branching Workflow

      - Do not create branches or PRs unless explicitly asked
      - When creating a branch, use a short descriptive name
      - Keep all changes for a given task within a single branch
      - Always branch off `main` or `master`. If asked to branch off anything else, push back and confirm before proceeding

      ## General

      - **Use `git log`** - View commit history to understand context and recent changes
      - **File removal:** Use `git rm` to remove files, not `rm`

      ## Submodules

      - Treat submodules as write-protected by default
      - Require explicit permission before any submodule write — pointer updates, content changes, `git submodule update`, sync, init, deinit
      - A single prior approval does not carry forward; ask each time
      - Submodule updates are high-blast-radius and often unintentional
      - Treat unexpected submodule state as in-progress work; investigate before overwriting

      ## Commit Messages

      - Keep commit messages straightforward and to the point
      - Only describe the code changes made
      - Do not include extraneous details or meta-commentary
      - **NEVER mention Claude, Anthropic, AI, or "Generated with" in commit messages**
      - Commit messages describe code changes only, not the tools used

      ## Breaking Changes

      - **Version <1.0:** No backwards compatibility required. Clean up deprecated code immediately.
      - **New major versions:** No backwards compatibility required. Remove deprecated APIs.
      - **Post-1.0 minor/patch:** Discuss breaking changes before implementing

      ## Git Hooks: lefthook

      - Configure in `lefthook.yml`
      - Run linting, formatting, tests on pre-commit
      - Language-agnostic, fast parallel execution

      ## Pre-commit Checklist

      Before committing:
      - Run linters (ruff, clippy, golangci-lint)
      - Run formatters (ruff format, cargo fmt, gofmt)
      - Run tests
      - Fix all issues before committing - do not commit broken code
      - Fix pre-commit errors automatically without asking

      ## Bypassing Hooks

      - Bypass only for WIP on feature branches
      - Document bypass with `--no-verify` and reasoning
