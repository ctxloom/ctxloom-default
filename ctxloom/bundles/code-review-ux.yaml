        content: |-
            # Lens: User Experience (user-facing apps)

            How does it feel for the end user?

            ## Check
            - User-facing copy: clear, consistent, non-jargon, correct tone.
            - States handled: loading, empty, error, success, partial — no dead ends;
              actionable error messages with recovery.
            - Consistency with existing UI patterns; no surprising behavior.
            - Friction: fewest steps for the common task; sensible defaults; destructive
              actions confirmed/undoable.
