        content: |-
            # Lens: Data, Migrations & Privacy

            ## Migrations
            - Backward/forward compatible during rollout (expand–contract); reversible/
              rollback path; no long locks on large tables; safe defaults for new
              NOT NULL columns; zero/low-downtime.

            ## Integrity
            - Referential integrity; transactions/atomicity around multi-step writes;
              idempotency for retried operations.

            ## Privacy / PII
            - PII identified and minimized to purpose; masked/pseudonymized where possible;
              no PII in logs; encryption of sensitive fields; retention/deletion honored.
            - Regulatory: support deletion/DSAR across systems; flag automated-decision/
              profiling flows (GDPR / CCPA-CPRA).
