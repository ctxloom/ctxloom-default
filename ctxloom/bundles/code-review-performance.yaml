description: Performance & efficiency review lens. Language-agnostic `general` fragment plus per-language performance footguns. Compose `code-review-performance#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    general:
        tags:
        - review
        - performance
        content: |-
            # Lens: Performance & Efficiency

            Does it use time, memory, and I/O well — and scale?

            ## Check
            - Hot-path work: avoidable allocations/serialization, expensive ops inside
              loops, repeated recomputation (cache where sound).
            - I/O & data access: N+1 queries, unbatched/chatty calls, missing
              pagination, fetching more than needed.
            - **Unbounded growth**: in-memory collections/caches without limits or
              eviction; goroutine/thread leaks.
            - Scalability: statelessness for horizontal scale; no global locks on hot
              paths; back-pressure.

            Distinguish proven hot paths from micro-optimization; deep claims need
            profiling (say so). Pair with the project's language fragment.
