            - Stream overhead vs loop on hot paths; avoid reflection.
            - **GC pressure**: minimize allocations in hot code.
            - Benchmark with **JMH** (account JIT warmup).
        distilled_by: claude-haiku-4-5-20251001
    kotlin:
        tags:
            - review
            - performance
            - kotlin
        content: |-
            # Lens: Performance — Kotlin

            ## Check
            - **`inline`** functions with lambda params to avoid per-call allocation.
            - **Avoid boxing**: nullable primitives (`Int?`) and generic boxing; use
              `IntArray`/specialized arrays in hot code.
            - **`Sequence`** for large/lazy pipelines (eager collection ops build an
              intermediate each step).
            - Don't allocate lambdas/objects inside tight loops; JVM GC rules apply.
        content_hash: sha256:ec95b1110e57827f440aa3192a088d5ce981c0552020ed44dcf46199f93e4e72
        distilled: |-
            # Lens: Performance — Kotlin

            ## Check
            - **`inline`** lambdas to avoid per-call allocation
            - **Avoid boxing**: use `IntArray`/specialized arrays in hot code (not `Int?`, generics)
            - **`Sequence`** for large/lazy pipelines (vs eager ops)
            - No lambda/object allocation in tight loops (JVM GC)
        distilled_by: claude-haiku-4-5-20251001
    python:
        tags:
            - review
            - performance
            - python
        content: |-
            # Lens: Performance — Python

            ## Check
            - **Algorithm first** — Big-O dominates (3.14+ ships an experimental JIT,
              still no substitute for a better algorithm).
            - **Push hot loops into C**: built-ins, `numpy`, vectorization over
              Python-level iteration.
            - **Generators** for large/streaming data; `__slots__` for many small
              objects.
            - Hoist attribute/global lookups out of tight loops; `functools.lru_cache`
              for repeated pure calls.
            - **CPU parallelism**: `multiprocessing`, or threads on a free-threaded build
              (3.13t+); the GIL build still serializes. `str.join` over `+=`.
        content_hash: sha256:12aac36c3e6c1679d355ee9e45d6fa14e65ac2bda25ad81d64401258f55f623d
        distilled: |-
            # Lens: Performance — Python

            ## Check
            - **Algorithm first** — Big-O dominates; 3.14+ JIT experimental.
            - **Hot loops to C**: built-ins, `numpy`, vectorization.
            - **Generators** (large/streaming); `__slots__` (many small objects).
            - Hoist attribute/global lookups from loops; `functools.lru_cache` for repeated calls.
            - **Parallelism**: `multiprocessing`/threads; free-threaded (3.13t+), GIL serializes (3.13-).
            - Use `str.join` over `+=`.
        distilled_by: claude-haiku-4-5-20251001
    rust:
        tags:
            - review
            - performance
            - rust
        content: |-
            # Lens: Performance — Rust

            ## Check
            - **Avoid needless `clone()`/allocations**; borrow where possible; `&str`
              over `String`.
            - **`Vec::with_capacity`**; iterator chains over building intermediate
              collections.
            - Watch `Arc`/`Mutex` contention and `format!` in hot paths; `#[inline]`
              judiciously.
            - **Benchmark in release** (`criterion`/`divan`) — debug builds aren't
              representative.
            - Reach for SIMD/`unsafe` only with profiling evidence.
        content_hash: sha256:e05e78d7fa98484ee91e77af0c9a68155ccee6bfdeb6a5e658022c6796f44f03
        distilled: |-
            # Lens: Performance — Rust

            - Avoid needless `clone()`/allocations; borrow; `&str` not `String`
            - `Vec::with_capacity`; iterator chains not intermediate collections
            - `Arc`/`Mutex` contention, `format!` in hot paths; `#[inline]` sparingly
            - Benchmark release (`criterion`/`divan`), not debug
            - SIMD/`unsafe` require profiling
        distilled_by: claude-haiku-4-5-20251001
    swift:
        tags:
            - review
            - performance
            - swift
        content: |-
            # Lens: Performance — Swift

            ## Check
            - **Copy-on-write** types (Array/Dictionary/String): avoid triggering copies
              by mutating a shared reference; `reserveCapacity`.
            - **ARC overhead**: minimize retain/release churn in hot loops; prefer value
              types.
            - **Devirtualization**: `final`/`private`/whole-module optimization let the
              compiler inline; avoid dynamic dispatch on hot paths.
            - **`InlineArray`/`Span`** (Swift 6.2) for stack-allocated fixed arrays / safe
              contiguous access without `Unsafe*Pointer`.
            - Avoid bridging to `NS*` types; profile with Instruments.
        content_hash: sha256:6fd82862c17706a4afaad46e901cc15fccc73d7458fdd53bb2707650c9e838cd
        distilled: |-
            # Lens: Performance — Swift

            - **Copy-on-write** (Array/Dictionary/String): avoid copies; `reserveCapacity`
            - **ARC**: minimize churn in hot loops; prefer value types
            - **Devirtualization**: `final`/`private`/whole-module; no dynamic dispatch
            - **`InlineArray`/`Span`**: stack-allocated, safe without `Unsafe*Pointer`
            - Avoid `NS*` bridging; profile with Instruments
        distilled_by: claude-haiku-4-5-20251001
    typescript:
        tags:
            - review
            - performance
            - typescript
        content: |-
            # Lens: Performance — TypeScript / JS

            ## Check
            - **Don't block the event loop**; chunk or offload heavy CPU work (workers).
            - **GC pressure**: avoid per-iteration allocations and array-method chains
              building intermediates on hot paths.
            - **Consistent object shapes** (avoid `delete`, polymorphic shapes) to keep
              the JIT optimized; `Map`/`Set` over object-as-map for dynamic keys.
            - Debounce/throttle event-driven work; memoize expensive pure computations.
            - Avoid `JSON.parse/stringify` and layout thrash in hot paths.
        content_hash: sha256:40cbfd676f2ccd63656c659cbfcb46f725ba30ad05ed8e6760b182392e400ec9
        distilled: |-
            # Lens: Performance — TypeScript / JS

