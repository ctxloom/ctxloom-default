version: 1.0.0
tags:
    - review
    - performance
author: ctxloom
description: Performance & efficiency review lens. Language-agnostic `general` fragment plus per-language performance footguns. Compose `code-review-performance#fragments/general` with the project's language fragment as a `ctxloom weave` member.
fragments:
    cpp:
        tags:
            - review
            - performance
            - cpp
        content: |-
            # Lens: Performance — C++

            ## Check
            - **Move semantics** to avoid copies; pass by `const&` or by value+`std::move`.
            - **`reserve()`** containers; avoid heap allocation in hot loops.
            - **Cache locality**: contiguous data, mind AoS vs SoA; avoid
              pointer-chasing.
            - Avoid virtual dispatch on hot paths; `std::string_view` for non-owning
              reads.
            - Don't overuse `shared_ptr` (atomic refcount cost); profile (perf,
              cachegrind) before optimizing.
        content_hash: sha256:5ca62b53383f2391016543d07a6ff684fd8e0e13ea64982fac3266c5b810cf6c
        distilled: |-
            # Lens: Performance — C++

            ## Check
            - Move semantics: `const&` or `value+std::move`.
            - `reserve()` containers; avoid heap in hot loops.
            - Cache locality: contiguous data, AoS vs SoA; avoid pointer-chasing.
            - No virtual dispatch in hot paths; `std::string_view` non-owning.
            - Use `shared_ptr` sparingly (atomic refcount cost); profile before optimizing.
        distilled_by: claude-haiku-4-5-20251001
    csharp:
        tags:
            - review
            - performance
            - csharp
        content: |-
            # Lens: Performance — C#

            ## Check
            - **Avoid LINQ/closures** allocating on hot paths (though .NET 9 vectorized many
              ops and added `CountBy`/`AggregateBy`); prefer loops on the hottest paths.
            - **`Span<T>`/`Memory<T>`/`stackalloc`/`ArrayPool`** to cut allocations and
              copies; `StringBuilder` for concatenation.
            - **Struct vs class**: avoid boxing; `readonly struct` for value-heavy code.
            - `ValueTask` for hot async; preallocate collection capacity.
            - Benchmark with **BenchmarkDotNet**; watch GC generation pressure.
        content_hash: sha256:83d7c9a27403a6bff5aa36945ee8975534ffcacef61871ce58d24531450fb2d0
        distilled: |-
            # Lens: Performance — C#

            ## Check
            - Avoid LINQ/closures on hot paths; prefer loops
            - `Span<T>`/`Memory<T>`/`stackalloc`/`ArrayPool` for low allocations; `StringBuilder` for concatenation
            - Prefer `struct` over `class` (avoid boxing); `readonly struct` for values
            - `ValueTask` for async; preallocate collection capacity
            - Benchmark with BenchmarkDotNet; monitor GC pressure
        distilled_by: claude-haiku-4-5-20251001
    general:
        tags:
            - review
            - performance
        content: |-
            # Lens: Performance & Efficiency

            Does it use time, memory, and I/O well — and scale?

            ## Check
            - Hot-path work: avoidable allocations/serialization, expensive ops inside
              loops, repeated recomputation (cache where sound).
            - I/O & data access: N+1 queries, unbatched/chatty calls, missing
              pagination, fetching more than needed.
            - **Unbounded growth**: in-memory collections/caches without limits or
              eviction; goroutine/thread leaks.
            - Scalability: statelessness for horizontal scale; no global locks on hot
              paths; back-pressure.

            Distinguish proven hot paths from micro-optimization; deep claims need
            profiling (say so). Pair with the project's language fragment.
        content_hash: sha256:092626048d9ec19cd79b9baeec12cd00d607326d9a2017b4e74613c29a901da8
        distilled: |-
            # Lens: Performance & Efficiency

            Time, memory, I/O usage and scalability?

            ## Check
            - Hot-path: avoidable allocations/serialization, expensive ops in loops, repeated recomputation (cache appropriately).
            - I/O & data access: N+1 queries, unbatched/chatty calls, missing pagination, over-fetching.
            - **Unbounded growth**: in-memory collections/caches without limits/eviction; goroutine/thread leaks.
            - Scalability: statelessness for horizontal scale; no global locks on hot paths; back-pressure.

            Distinguish proven hot paths from micro-optimization. Profile deep claims. Pair w/ language fragment.
        distilled_by: claude-haiku-4-5-20251001
    golang:
        tags:
            - review
            - performance
            - go
        content: |-
            # Lens: Performance — Go

            ## Check
            - **Preallocate** slices/maps with capacity when the size is known.
            - **Reduce allocations** on hot paths (escape analysis; `sync.Pool` for
              reuse); `strings.Builder` over `+` in loops.
            - **Avoid copying large structs** — pass pointers; mind `[]byte`↔`string`
              conversions (they copy).
            - Watch interface boxing and `defer` overhead in tight loops.
            - Profile with `pprof` before optimizing; benchmark with `testing.B`.
        content_hash: sha256:81df73684998a3ac42a7476826019a47c81c8044733c56747924b1c4a6afc1c7
        distilled: |-
            # Lens: Performance — Go

            - **Preallocate** slices/maps with known size.
            - **Reduce allocations** hot paths: `sync.Pool`, `strings.Builder` vs `+` in loops.
            - **Avoid copying large structs** — pointers; `[]byte`↔`string` conversions copy.
            - Interface boxing & `defer` overhead in tight loops.
            - `pprof` before optimizing; `testing.B` benchmarks.
        distilled_by: claude-haiku-4-5-20251001
    java:
        tags:
            - review
            - performance
            - java
        content: |-
            # Lens: Performance — Java

            ## Check
            - **Avoid autoboxing** in hot loops (primitive arrays/specialized
              collections).
            - **`StringBuilder`** over `+` in loops; preallocate collection capacity.
            - Stream overhead vs a plain loop on hot paths; avoid reflection there.
            - **GC pressure**: minimize short-lived allocations in hot code.
            - Benchmark with **JMH** (account for JIT warmup); don't trust raw
              micro-timings.
        content_hash: sha256:9101c7c34034e7778faf094e5467d31157ba17bbebd81745b4beb5ba8aca85e9
        distilled: |-
