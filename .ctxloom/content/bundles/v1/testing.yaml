        content: |-
            # Test Coverage

            Target 90%+ coverage. Unit + integration tests exercising the full application.

            ## Acceptable Gaps

            - Main entrypoints (tested via E2E)
            - Generated code
            - Panic/fatal paths that can't occur
            - Default factory functions (exclude via tooling)
