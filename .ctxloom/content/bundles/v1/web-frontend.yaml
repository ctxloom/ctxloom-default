        content: |-
            # React (TypeScript)

            ## Component Structure

            ```
            components/
              Button/
                Button.tsx        # Component
                Button.test.tsx   # Tests co-located
                index.ts          # Re-export
            ```

            ## Function Components Only

            ```typescript
            // Named export, explicit return type
            export function UserCard({ user }: UserCardProps): React.ReactElement {
              return <div>{user.name}</div>
            }

            // Props interface above component
            interface UserCardProps {
              user: User
              onSelect?: (user: User) => void
            }
            ```
        content_hash: sha256:5475cb45f73c71756838d6fe3b32f86b58355b40c4e71c91e7ab21ed413d0d91
        distilled: 'React: one folder per component (`Button/Button.tsx` + `Button.test.tsx` co-located + `index.ts` re-export). Function components only; named exports; explicit `React.ReactElement` return type; props interface declared above the component.'
        distilled_by: claude-code
    vite:
        tags:
        - vite
        - build
        - web
        content: |-
            # Vite

            ## Config (vite.config.ts)

            ```typescript
            import { defineConfig } from 'vite'
            import react from '@vitejs/plugin-react'

            export default defineConfig({
              plugins: [react()],
              build: {
                rollupOptions: {
                  output: {
                    // Content-hashed filenames for caching
                    entryFileNames: 'assets/[name]-[hash].js',
                    chunkFileNames: 'assets/[name]-[hash].js',
                    assetFileNames: 'assets/[name]-[hash].[ext]',
                  },
                },
              },
              server: {
                // Disable caching in dev
                headers: { 'Cache-Control': 'no-store' },
              },
            })
            ```
        content_hash: sha256:c7542832e1f313594b076ecf41cc1dfb5defb45ce1aabf7d83991f8a21c83118
        distilled: 'Vite config: content-hashed output filenames via build.rollupOptions.output (`assets/[name]-[hash].js` for entries/chunks, `assets/[name]-[hash].[ext]` for assets) and dev server header `Cache-Control: no-store`.'
        distilled_by: claude-code
