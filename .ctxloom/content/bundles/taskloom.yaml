version: 1.0.0
tags:
    - taskloom
    - tasks
    - tooling
author: ctxloom
description: taskloom — persistent per-project task tracking; tooling declaration for the companion binary.
notes: |
    ctxloom EMBEDS the taskloom usage fragment as a builtin (it auto-injects
    whenever the companion binary is present), so this bundle ships no
    usage fragment. It ships the deferral-tracking policy fragment (a
    behavioral default layered on the builtin) plus the tooling declaration
    that gets the binary into agent environments in the first place.
fragments:
    deferral-tracking:
        tags:
            - tasks
            - workflow
        content: |
            # Deferral Tracking

            Deferred work lives in taskloom, not in conversation memory or plan prose.

            ## Search before you create

            Before `task_add`, search the existing log. Use `task_list` with a `term` filter, or a `tag_query`, and search on the distinctive noun — the file, symbol, command or subsystem — not on your own phrasing of the problem. Whoever filed it first almost certainly worded it differently.

            If something already covers the work, UPDATE it (`task_edit`, or append a dated note to its text) rather than filing a second entry. Create only when nothing matches.

            Why this matters more than it sounds: backlogs accumulate duplicates fast, because the same defect gets rediscovered from a different angle in a different session. The failure mode is not just clutter — a second filing often *contradicts* the first, prescribing an opposite fix, and whoever picks them up later has no way to tell which is current. Two tasks disagreeing about the same bug is worse than one stale task.

            Check for an existing entry even when you are confident the finding is new.

            ## Agent deferrals

            When work gets deferred in a session — descoped from the current task, a follow-up discovered mid-implementation, a fix postponed — record it with task_add before moving on:

            - A concrete revive condition exists ("after X merges", "when CI is green") → status "Deferred" with that condition as the trigger.
            - No condition, just later → "To Do".

            Don't close out work that spawned deferred items until each one is recorded.

            ## User deferrals

            When the user defers something ("later", "not now", "punt on that", "park it"), offer to record it as a taskloom entry and create it on confirmation. One short offer alongside the acknowledgment; don't push if declined.

            ## Why

            A deferral that exists only in chat or a plan file is lost when the session ends. The task log is the durable record; plans and summaries reference entries by harp ID.
