    mutation-as-test-validator:
        content: |-
            # Mutation Testing as a Test Validator

            Passing tests are not proof that tests are good. Mutation testing is the deterministic check.

            LLMs produce plausible-looking tests at scale; "plausible" is not "meaningful." Mutation testing catches the failure modes: tautological assertions (`assert_eq!(result, calculate(5, 3))` always passes), missing edge cases at boundaries, and implementation-coupled tests that are brittle to refactor but blind to real bugs.

            ## Workflow Integration

            After the TDD round-trip:

            1. LLM writes tests
            2. You review tests
            3. LLM implements
            4. **Run mutation testing**
            5. Analyze survivors: which behaviors are not actually tested?
            6. Add tests that kill survivors, or accept the gap explicitly

            ## Tools

            - Rust: `cargo-mutants`
            - Java: `pitest`
            - Python: `mutmut`, `cosmic-ray`
            - JS/TS: `stryker`
            - Go: `gomutation`, `go-mutesting`

            ## Target Kill Rates

            | Code shape | Target |
            |---|---|
            | Pure utility functions | 80-90%+ |
            | Business logic | 80-90% |
            | Framework glue delegating to tested core | 60-70% |
            | Logging-only paths | survivors acceptable |

            Teams with 80-90% code coverage routinely discover 30% mutation kill rates on first adoption. Coverage measures execution; mutation testing measures verification.

            ## Anti-Patterns

            - Treating high code coverage as test quality.
            - Killing a surviving mutant by adding `assert!(true)` adjacent to the line. Score goes up; signal goes to zero.
        content_hash: sha256:b7d3dba5beb3c0e90d17b38f9fb424577a829a0a2e7a6dfffb373f26ac020d75
        distilled: 'Mutation testing is the deterministic check on test quality; LLM tests look plausible while hiding tautological assertions, boundary gaps, and implementation coupling. After the TDD round-trip: run mutation testing, analyze survivors, add tests that kill them or accept the gap explicitly. Tools: cargo-mutants (Rust), pitest (Java), mutmut/cosmic-ray (Python), stryker (JS/TS), gomutation/go-mutesting (Go). Kill-rate targets: 80-90% pure functions and business logic, 60-70% framework glue, logging-only paths exempt. Coverage measures execution, mutation measures verification (80-90% coverage teams routinely see 30% kill rates). Never game the score with adjacent `assert!(true)`.'
        distilled_by: claude-code
        tags:
        - ai
        - coding
        - best-practices
        - workflow
        - testing
        - mutation-testing
        - validation
    no-provenance-comments:
        content: |
            # No Provenance in Comments

            Comments state invariants. Git records timeline.

            ## The Rule

            Do not put git-provenance metadata in code comments or in prose about the codebase. This includes:

            - Commit hashes (`see commit abc123`)
            - Milestone tags (`wired in P0.2`)
            - PR numbers (`added in #1234`)
            - Release versions used as historical markers (`introduced in 1.4.0`)
            - Author and date stamps (`added by Alice 2024-01-15`)
            - TODO references to sprints or iterations (`TODO from sprint 47`)

            ## Why

            - Commit hashes break after rebase or squash
            - Milestone tags become ambient noise once the project moves past them
            - Author and date stamps age into tombstones that survive the author leaving and the line being rewritten
            - Git already records all of this in `git blame` and `git log`; duplication guarantees divergence

            ## What to Write Instead

            State the load-bearing invariant. If the comment would still be true after a git history rewrite, keep it. If not, you wrote a timeline entry in the wrong file.

            Before:
            ```go
            // reflection.Register: wired in P0.2 (commit abc123). Canonical.
            ```

            After:
            ```go
            // reflection.Register: canonical "what does this server speak"
            // mechanism. Do not add a parallel descriptor service.
            ```

            ## Where Provenance Actually Lives

            - `git blame` and `git log` on the line itself
            - Commit message body and PR description
            - `CHANGELOG.md` or release notes
            - ADRs (architectural decisions log)
            - Issue tracker history

            ## Exceptions (Not Provenance)

            - External stable identifiers: RFC numbers, CVE IDs, language-spec versions. Stable outside your repo.
            - Public-API `@since` annotations: the version is part of the API contract for consumers.
            - "We tried X and it failed" comments: invariant content (the rejected approach); the dated artifact lives in the rationale, not the comment.
        content_hash: sha256:2598d86fbbdc712913f84f88c968579dcc02d38ade0b9481e467608ace3c5533
