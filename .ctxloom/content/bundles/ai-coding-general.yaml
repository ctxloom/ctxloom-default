author: ctxloom
description: AI coding best practices - context engineering, workflows, version specs, review checklists
fragments:
    concurrency-warnings:
        content: |-
            # Concurrency Warnings

            AI-authored code is approximately 2x more likely to make concurrency and dependency-correctness mistakes than human-only code (CodeRabbit, *State of AI vs Human Code Generation*, 2025; 470 PRs analyzed, ~1.7x more issues overall, concurrency a leading subcategory).

            Do not "optimize" sequential awaits into parallel ones; ordering may be load-bearing. Mark intentional ordering with `// SYNC-REQUIRED: [reason]`:

            ```javascript
            // SYNC-REQUIRED: email needs user.id from save
            await saveUser(user);
            await sendEmail(user);

            // AI BUG: await Promise.all([saveUser, sendEmail])
            ```
        content_hash: sha256:fce2fef1c1846f8f2d337cb7c209620d510a465777e5c5b8038077e1097e5058
        distilled: 'AI code makes ~2x more concurrency mistakes than human code (CodeRabbit 2025, 470 PRs). Never parallelize sequential awaits; mark load-bearing ordering with `// SYNC-REQUIRED: [reason]`.'
        distilled_by: claude-code
        tags:
        - ai
        - coding
        - best-practices
        - workflow
        - concurrency
        - safety
    context-engineering:
        content: |-
            # CLAUDE.md Rules

            **Size: 100-200 lines max.** Move overflow to per-folder CLAUDE.md files.

            ## Must Include
            ```markdown
            # Tech Stack
            Language, framework, database, testing tools with versions

            # Architecture
            Directory structure with purpose of each folder

            # Commands
            Build, test, lint, deploy commands

            # Coding Rules
            Project-specific conventions AI would violate otherwise
            ```

            ## Do NOT Include
            - General language syntax
            - Patterns already enforced by linters
            - Things Claude does correctly without instruction

            **Test:** Would Claude make a mistake without this line? If no, delete it.

            **Maintenance:** When Claude makes a mistake, add the correction to CLAUDE.md immediately.
        content_hash: sha256:47c4d74f5fc089f33bade4a78bfd7ae3eebdefddde34dd10c4139e9ade31d513
        distilled: 'CLAUDE.md: 100-200 lines max, overflow to per-folder files. Include: tech stack with versions, architecture (folder purposes), build/test/lint/deploy commands, project-specific rules AI would otherwise violate. Exclude: language syntax, linter-enforced patterns, anything Claude gets right unprompted. Test each line: would Claude err without it? No → delete. When Claude errs, add the correction immediately.'
        distilled_by: claude-code
        tags:
        - context
        - claude-code
        - workflow
    human-review-checklist:
        content: |-
            # Human Review Checklist

            AI code: correct happy path, dangerous elsewhere.

            ## Hallucination Check

            LLMs reference nonexistent packages at 5.2% (commercial models) to 21.7% (open-source models) rates (Spracklen et al., *We Have a Package for You!*, arXiv:2406.10279, 2024; 16 LLMs, 576k samples). Verify before trusting.

            - Verify imports: `npm info`, `pip show`, `cargo search`
            - Check API signatures
            - Confirm endpoints exist

            ## Test Integrity (AI "fixes" by)
            - Deleting tests
            - Removing assertions
            - Mocking away behavior
            - (See `mutation-as-test-validator` for the deterministic check that catches this.)

            ## Red Flags
            - Deleted code unexplained
            - Catch-all replacing specific handlers
            - Removed validation
            - async/sync changes without reason
            - Unjustified new deps

            ## Reject Immediately
            - Security vulns in sensitive code
            - Deleted tests w/o justification
            - Hallucinated deps
            - Race conditions
            - Missing error handling in critical paths
        content_hash: sha256:b09ab85a2fbe7a45f34f7e626d812d508c02d8af9cdc4a1b1150e6ff2a14046a
        distilled: 'AI code: correct happy path, dangerous elsewhere. LLMs hallucinate packages at 5.2-21.7% rates (arXiv:2406.10279) — verify imports (`npm info`/`pip show`/`cargo search`), API signatures, endpoints. Test integrity: AI "fixes" by deleting tests, removing assertions, mocking away behavior (mutation testing catches this). Red flags: unexplained deletions, catch-alls replacing specific handlers, removed validation, async/sync flips, unjustified deps. Reject immediately: security vulns in sensitive code, deleted tests, hallucinated deps, race conditions, missing error handling in critical paths.'
        distilled_by: claude-code
        tags:
        - ai
        - coding
        - best-practices
        - workflow
        - review
        - security
        - quality
    is-this-a-standard:
        content: |
            # Is This a Standard?

            Before writing infrastructure, ask one question:

            > Is this a standard?

            If the answer is yes, ask:

            > Did we already wire it in?

            ## Why

            LLMs default to local construction. They have seen a thousand examples of "service that lists what a server does" and can produce another one. They have also seen `grpc.reflection.v1.ServerReflection` a thousand times, but the prompt was about your problem, not the standard. The model writes what it can write end-to-end over what it would have to look up.

            ## Common Categories AIs Reinvent

            - gRPC Server Reflection (use `grpc.reflection.v1.ServerReflection`)
            - OpenTelemetry instrumentation (use OTLP exporters, not custom telemetry)
            - JWT validation (use a vetted library, not hand-rolled)
            - OAuth 2.0 Device Authorization Grant (use a library)
            - JSON Schema validation (use the metaschema)
            - Kubernetes AdmissionReview (use the standard webhook shape)
            - Conventional Commits parsing (use an existing parser)
            - Healthchecks (use `grpc.health.v1.Health`)

            ## What to Do

            When the AI proposes writing infrastructure:

            1. Name the category ("this sounds like server discovery")
            2. Ask whether a standard exists for that category
            3. If yes, ask whether the project already wires it in
            4. Use the standard

            ## Load-Bearing Comments

            At the registration site of a standard mechanism, leave a comment that names the invariant:

            ```go
            // reflection.Register: the canonical "what does this server speak"
            // mechanism. Do not add a parallel descriptor service; ask reflection.
            reflection.Register(grpcServer)
            ```

            These comments live next to the call that triggers the temptation to reinvent. They do not depend on the AI consulting an external document.
